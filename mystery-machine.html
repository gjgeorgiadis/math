body{
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,#8fd3ff 0%,#c9f0ff 38%,#fff3c9 100%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
sup{ font-size:.58em; vertical-align:super; line-height:0; }

/* ---------- top bar ---------- */
.top{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:rgba(255,255,255,.88); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  box-shadow:0 3px 14px rgba(40,60,110,.14);
}
.home{
  flex:none; display:inline-flex; align-items:center; gap:6px;
  background:var(--ink); color:#fff; text-decoration:none; font-weight:900; font-size:15px;
  padding:9px 14px; border-radius:999px; box-shadow:0 4px 0 rgba(0,0,0,.18);
}
.home:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
.gtitle{ flex:1; min-width:0; text-align:center; font-weight:900; font-size:clamp(16px,4.4vw,22px);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pill{ flex:none; font-weight:900; font-size:15px; background:#fff4cc; border:2px solid #ffd966;
  padding:6px 10px; border-radius:999px; }
.iconbtn{ flex:none; width:40px; height:40px; border-radius:50%; border:2px solid var(--line);
  background:#fff; font-size:19px; display:grid; place-items:center; }
.iconbtn.off{ opacity:.6; }
.vbtn{ flex:none; height:40px; border-radius:999px; border:2px solid #b8e0c4; background:#e6f7ec; color:#12743a;
  font-weight:900; font-size:14px; padding:0 11px; white-space:nowrap; }
.vbtn.off{ border-color:#e3c3c3; background:#fdeeee; color:#a03a3a; }
.vbtn.off span{ text-decoration:line-through; text-decoration-thickness:2px; }
.toast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 66px); transform:translateX(-50%); z-index:90; pointer-events:none;
  background:#23314f; color:#fff; font-weight:800; font-size:15px; padding:10px 18px; border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.25); max-width:calc(100vw - 32px); text-align:center; transition:opacity .4s; animation:fade .2s; }
.toast.out{ opacity:0; }
@media (max-width:420px){ .home span, .gtitle .gi{ display:none; } .top .pill{ display:none; } .iconbtn{ width:36px; height:36px; font-size:17px; } .vbtn{ height:36px; font-size:13px; padding:0 9px; } }

.screen{ max-width:1040px; margin:0 auto; padding:14px 14px calc(env(safe-area-inset-bottom) + 30px); }

/* ---------- lego brick ---------- */
.brick{
  --c:var(--red);
  position:relative; display:flex; align-items:center; justify-content:center;
  background:var(--c); color:#fff; border-radius:7px; font-weight:900;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.35), 0 3px 7px rgba(20,30,60,.18);
  text-shadow:0 2px 0 rgba(0,0,0,.22);
  font-variant-numeric:tabular-nums;
}
.brick::before{
  content:""; position:absolute; left:8%; right:8%; top:-6px; height:7px;
  background:radial-gradient(circle at 50% 75%, var(--c) 0 4.3px, transparent 4.8px) center top/17px 7px repeat-x;
  filter:brightness(1.1);
}
.brick.lt{ color:var(--ink); text-shadow:none; }
.c-red{--c:var(--red)} .c-blue{--c:var(--blue)} .c-green{--c:var(--green)} .c-yellow{--c:var(--yellow)}
.c-orange{--c:var(--orange)} .c-purple{--c:var(--purple)} .c-azure{--c:var(--azure)} .c-lime{--c:var(--lime)}
.c-pink{--c:var(--pink)} .c-grey{--c:var(--grey)}

/* ---------- blanks (answer slots) ---------- */
.blank{
  cursor:pointer; background:#fff; color:var(--ink); text-shadow:none;
  outline:3px dashed #a9b8d3; outline-offset:-3px;
}
.brick.blank{ --c:#eef2f9; box-shadow:0 3px 7px rgba(20,30,60,.12); }
.blank:empty::after{ content:"?"; color:#b3bfd6; }
.blank.sel{ outline:4px solid #ffb020; outline-offset:-4px; background:#fffbea; animation:glow 1.1s ease-in-out infinite; }
.blank.bad{ outline:4px solid #e5484d; outline-offset:-4px; color:#e5484d; animation:shake .36s; }
.blank.ok{ outline:none; background:var(--green); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.2); animation:pop .35s; }
.brick.blank.ok{ --c:var(--green); }
.blank.given{ outline:none; background:var(--orange); color:#fff; }
.brick.blank.given{ --c:var(--orange); }
.blank.hl, .hl{ box-shadow:0 0 0 4px #ffb020, 0 3px 7px rgba(20,30,60,.18) !important; }
@keyframes glow{ 50%{ box-shadow:0 0 0 6px rgba(255,176,32,.35); } }
@keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
@keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.18)} 100%{transform:scale(1)} }

/* ---------- level map ---------- */
.maphead{
  display:flex; align-items:center; gap:14px; background:#fff; border-radius:22px; padding:14px 16px;
  box-shadow:0 8px 20px rgba(40,60,110,.14); border-top:8px solid var(--gc);
}
.maphead .bigicon{ flex:none; width:64px; height:64px; display:grid; place-items:center; font-size:48px; }
.maphead .bigicon svg{ width:64px; height:64px; }
.maphead h1{ font-size:clamp(22px,5.5vw,30px); font-weight:900; line-height:1.1; }
.maphead p{ font-weight:700; color:var(--muted); font-size:14.5px; margin-top:4px; }
.maphead .grow{ flex:1; min-width:0; }
.levels{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin:18px 0; }
@media (max-width:420px){ .levels{ grid-template-columns:1fr 1fr; gap:12px; } }
.lvl{
  position:relative; border:none; text-align:left; border-radius:16px; padding:18px 12px 12px; min-height:112px;
  background:var(--lc); color:#fff; display:flex; flex-direction:column; gap:3px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.2), 0 6px 14px rgba(20,30,60,.16);
}
.lvl::before{
  content:""; position:absolute; left:14px; right:14px; top:-7px; height:9px;
  background:radial-gradient(circle at 50% 80%, var(--lc) 0 6px, transparent 6.5px) left top/26px 9px repeat-x;
  filter:brightness(1.12);
}
.lvl .ln{ font-size:30px; font-weight:900; line-height:1; text-shadow:0 2px 0 rgba(0,0,0,.2); }
.lvl .lname{ font-size:14px; font-weight:800; line-height:1.15; }
.lvl .lstars{ margin-top:auto; font-size:18px; letter-spacing:1px; }
.lvl .lstars .no{ opacity:.35; filter:grayscale(1); }
.lvl.locked{ background:#cfd7e6; color:#7b869c; box-shadow:inset 0 -6px 0 rgba(0,0,0,.08); }
.lvl.locked::before{ background:radial-gradient(circle at 50% 80%, #cfd7e6 0 6px, transparent 6.5px) left top/26px 9px repeat-x; }
.lvl.locked .ln::after{ content:" 🔒"; font-size:18px; }
.lvl.next{ animation:bob 1.4s ease-in-out infinite; box-shadow:inset 0 -6px 0 rgba(0,0,0,.2), 0 0 0 4px #fff, 0 0 0 8px #ffb020; }
.lvl:not(.locked):active{ transform:translateY(3px); }
.lvl.endless{ grid-column:1/-1; min-height:80px; background:linear-gradient(120deg,#23314f,#5b3fd0); }
.lvl.endless::before{ display:none; }
.lvl.endless.locked{ background:#cfd7e6; }
@keyframes bob{ 50%{ transform:translateY(-4px); } }
.howto{ background:rgba(255,255,255,.75); border-radius:18px; padding:14px 16px; font-weight:700; color:#3a4766; font-size:15px; line-height:1.45; }
.howto b{ color:var(--ink); }

/* ---------- play ---------- */
.play{ display:grid; gap:12px; grid-template-columns:minmax(0,1fr); }
@media (min-width:800px) and (orientation:landscape){
  .play{ grid-template-columns:minmax(0,1fr) 330px; align-items:start; }
  .play .phead{ grid-column:1/-1; }
  .side{ position:sticky; top:74px; }
}
.phead{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between; }
.ptitle{ font-weight:900; font-size:17px; background:#fff; padding:7px 14px; border-radius:999px; box-shadow:0 3px 10px rgba(40,60,110,.12); }
.studs{ display:flex; gap:6px; }
.stud{ width:24px; height:24px; border-radius:50%; background:#fff; border:3px solid #c7d2e6; }
.stud.now{ border-color:#ffb020; animation:glow 1.1s infinite; }
.stud.gold{ background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc300 60%,#e0a100); border-color:#d69a00; }
.stud.silver{ background:radial-gradient(circle at 35% 30%,#fff,#c3cad6 60%,#9aa3b3); border-color:#8e97a8; }
.stud.miss{ background:#ffd9c2; border-color:#ff8a1f; }
.stud.bolt{ background:#ffe16b; border-color:#ffb020; }
.hearts{ font-size:22px; letter-spacing:2px; }
.score{ font-weight:900; font-size:17px; background:#23314f; color:#fff; padding:6px 14px; border-radius:999px; }
.stagewrap{ background:#fff; border-radius:22px; padding:16px 14px; box-shadow:0 8px 20px rgba(40,60,110,.14); min-width:0; }
.stage{ min-height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
.stage.enter{ animation:slidein .35s ease-out; }
@keyframes slidein{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
.prompt{ text-align:center; font-weight:800; font-size:clamp(15px,3.9vw,19px); margin-top:12px; line-height:1.35; color:#34405e; }
.msg{ text-align:center; font-weight:800; font-size:16px; min-height:24px; margin-top:8px; line-height:1.35; }
.msg.good{ color:var(--green); font-size:20px; }
.msg.bad{ color:#d4383d; }
.msg .hint{ display:block; margin-top:6px; background:#fff6d6; color:#5a4400; border-radius:12px; padding:8px 12px; font-weight:800; }
.reveal{ margin-top:10px; }
.reveal:empty{ display:none; }
.side{ background:#fff; border-radius:22px; padding:12px; box-shadow:0 8px 20px rgba(40,60,110,.14); }
.tools{ display:flex; gap:8px; margin-bottom:10px; }
.tool{ flex:1; border:2px solid var(--line); background:#f6f8fc; border-radius:12px; padding:9px 6px; font-weight:900; font-size:15px; }
.tool:active{ background:#e9eef8; }
.pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px 9px; padding-top:6px; }
.key{
  --c:var(--blue);
  position:relative; border:none; border-radius:10px; height:clamp(50px,7.2vh,64px);
  background:var(--c); color:#fff; font-size:28px; font-weight:900;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.3);
  text-shadow:0 2px 0 rgba(0,0,0,.2);
}
.key::before{
  content:""; position:absolute; left:18%; right:18%; top:-5px; height:6px;
  background:radial-gradient(circle at 50% 80%, var(--c) 0 4px, transparent 4.5px) center top/16px 6px repeat-x;
  filter:brightness(1.12);
}
.key:active{ transform:translateY(3px); box-shadow:inset 0 -2px 0 rgba(0,0,0,.22); }
.key.del{ --c:#8d96a8; font-size:24px; }
.key.go{ --c:var(--green); }
.key.sign{ --c:#5d6883; font-size:22px; }
.key.go.wide{ grid-column:span 3; height:clamp(44px,5.5vh,54px); }
.choices{ display:grid; gap:10px; }
.choices.pics{ grid-template-columns:1fr 1fr; gap:12px; }
.choices.pics .choice{ padding:10px; display:flex; align-items:center; justify-content:center; min-height:96px; }
@media (max-width:600px){ .choices.pics .choice{ min-height:80px; padding:8px; } }
.choice{
  border:none; border-radius:14px; padding:14px 12px; font-size:clamp(17px,4.4vw,21px); font-weight:900;
  background:#eef3ff; color:var(--ink); box-shadow:inset 0 -4px 0 rgba(0,0,0,.1); text-align:center; line-height:1.25;
}
.choice:active{ transform:translateY(2px); }
.choice.ok{ background:var(--green); color:#fff; animation:pop .35s; }
.choice.no{ background:#ffe1e1; color:#c04040; text-decoration:line-through; animation:shake .36s; }
.nextbtn.take{ background:var(--blue); animation:none; }
.nextbtn.take.dim{ background:#aeb8c9; }
.nextbtn.both{ background:var(--purple); margin-top:10px; font-size:19px; animation:none; }
.nextbtn{
  width:100%; border:none; border-radius:16px; padding:18px; font-size:26px; font-weight:900; color:#fff;
  background:var(--green); box-shadow:inset 0 -6px 0 rgba(0,0,0,.2); animation:bob 1.2s ease-in-out infinite;
}
.stage.win{ animation:pop .45s; }

/* ---------- overlay (intro / results) ---------- */
.overlay{ position:fixed; inset:0; z-index:50; background:rgba(20,30,55,.55); display:grid; place-items:center; padding:16px; animation:fade .2s; }
@keyframes fade{ from{opacity:0} }
.ocard{
  width:min(520px,100%); max-height:calc(100vh - 32px); overflow:auto; background:#fff; border-radius:26px; padding:22px 20px 18px;
  text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3); border-top:10px solid var(--gc,#ffb020); animation:popin .3s ease-out;
}
@keyframes popin{ from{ transform:scale(.85); opacity:0; } }
.ocard .kicker{ font-weight:900; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-size:13px; }
.ocard h2{ font-size:clamp(26px,7vw,34px); font-weight:900; margin:4px 0 8px; line-height:1.1; }
.ocard p{ font-weight:700; color:#3f4a66; font-size:16.5px; line-height:1.45; }
.ocard .demo{ margin:14px auto 4px; }
.obtns{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
.btn{
  border:none; border-radius:999px; padding:13px 22px; font-size:19px; font-weight:900; color:#fff; background:var(--green);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);
}
.btn.alt{ background:#e9eef8; color:var(--ink); }
.btn.blue{ background:var(--blue); }
.btn:active{ transform:translateY(2px); }
.bigstars{ font-size:54px; letter-spacing:6px; margin:6px 0; }
.bigstars span{ display:inline-block; animation:starin .5s both; }
.bigstars span.no{ filter:grayscale(1); opacity:.25; }
@keyframes starin{ from{ transform:scale(0) rotate(-90deg); } }
.badge{ display:inline-block; font-weight:900; font-size:15px; padding:6px 14px; border-radius:999px; background:#fff1b8; color:#6b4f00; margin:4px; }
.badge.new{ background:#dff7e6; color:#12743a; }
.resstuds{ display:flex; gap:6px; justify-content:center; margin:10px 0; }

/* confetti bricks */
.bit{ position:fixed; z-index:80; width:16px; height:10px; border-radius:3px; pointer-events:none; }


/* ---------- phones: keep the keypad in reach ---------- */
@media (max-width:600px){
  .screen.playing{ padding-bottom:0; }
  .play{ gap:10px; }
  .phead{ flex-wrap:nowrap; gap:8px; }
  .ptitle{ font-size:14.5px; padding:6px 11px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .studs{ gap:4px; flex:none; }
  .stud{ width:18px; height:18px; border-width:2.5px; }
  .stagewrap{ padding:12px 10px; }
  .stage{ min-height:140px; }
  .prompt{ margin-top:8px; }
  .side{ position:sticky; bottom:0; z-index:10; margin:0 -14px; border-radius:20px 20px 0 0;
    padding:8px 12px calc(env(safe-area-inset-bottom) + 10px); box-shadow:0 -6px 22px rgba(40,60,110,.18); }
  .tools{ margin-bottom:6px; }
  .tool{ padding:6px; font-size:14px; }
  .pad{ gap:9px 8px; }
  .key{ height:clamp(44px, 6.4vh, 58px); font-size:25px; }
  .nextbtn{ padding:14px; font-size:23px; }
  #prog{ flex:none; white-space:nowrap; }
  .hearts{ font-size:16px; letter-spacing:0; }
  .score{ font-size:14px; padding:5px 10px; }
}

/* ---------- Mystery Machine ---------- */
.mm{ width:100%; display:flex; flex-direction:column; align-items:center; gap:12px; }
.mmtop{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
.mmbox{ background:linear-gradient(160deg,#8a4fd8,#5b3fd0); color:#fff; font-weight:900; font-size:12px; letter-spacing:.06em;
  text-align:center; padding:14px 12px; border-radius:14px; box-shadow:inset 0 -5px 0 rgba(0,0,0,.25); line-height:1.35; }
.mmbox.big{ font-size:16px; padding:12px 20px; }
.mmarrow{ font-size:22px; color:#8d96a8; }
.mmin, .mmout{ display:flex; gap:6px; }
.slotbox, .asked, .mmout{ min-width:56px; height:52px; display:inline-grid; place-items:center; border-radius:12px;
  font-weight:900; font-size:24px; background:#eef3fb; border:3px solid #c7d2e6; padding:0 8px; }
.slotbox{ cursor:pointer; }
.slotbox.sel{ border-color:#ffb020; background:#fffbea; animation:glow 1.1s infinite; }
.asked{ background:#fff4cc; border-color:#ffd966; }
.mmout{ background:#e9f7ee; border-color:#9fd9b4; }
.mmout.pop{ animation:pop .4s; }
.mmout.good{ background:var(--green); color:#fff; border-color:var(--green); }
.mmlog{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:100%; }
.mmrow2{ background:#fff; border:2px solid #dfe6f3; border-radius:999px; padding:5px 12px; font-weight:800; font-size:15px; }
.mmq{ font-weight:900; font-size:clamp(15px,4vw,19px); text-align:center; line-height:1.4; }
.pad.mini .key{ height:clamp(40px,5.4vh,50px); font-size:22px; }
.knowit{ width:100%; margin-top:10px; border:none; border-radius:14px; padding:13px; font-size:18px; font-weight:900;
  color:#fff; background:var(--purple); box-shadow:inset 0 -5px 0 rgba(0,0,0,.2); }
.mmtip{ margin-top:6px; }

</style>

<body>
<div id="app"></div>
<script>
"use strict";
/* =====================================================================
   Math Lab — shared engine (inlined into every page)
   ===================================================================== */

// The game list. Each game unlocks when the previous game's level is cleared.
const CATALOG = [
  { id:"pyramids",  file:"brick-pyramids.html",  title:"Brick Pyramids",  needs:null },
  { id:"patterns",  file:"pattern-machine.html", title:"Pattern Machine", needs:{ game:"pyramids",  level:5 } },
  { id:"googol",    file:"googol-zoom.html",     title:"Googol Zoom",     needs:{ game:"patterns",  level:5 } },
  { id:"brickfit",  file:"brick-fit.html",       title:"Brick Fit",       needs:{ game:"googol",    level:5 } },
  { id:"takeaway",  file:"take-away.html",       title:"Take-Away",       needs:{ game:"brickfit",  level:5 } },
  { id:"gears",     file:"gear-lab.html",        title:"Gear Lab",        needs:{ game:"takeaway",  level:5 } },
  { id:"mystery",   file:"mystery-machine.html", title:"Mystery Machine", needs:{ game:"gears",     level:5 } },
  { id:"target",    file:"target-builder.html",  title:"Target Builder",  needs:{ game:"mystery",   level:5 } },
  { id:"ways",      file:"how-many-ways.html",   title:"How Many Ways",   needs:{ game:"target",    level:5 } },
  { id:"balance",   file:"balance-scale.html",   title:"Balance Scale",   needs:{ game:"ways",      level:5 } },
  { id:"primes",    file:"prime-factory.html",   title:"Prime Factory",   needs:{ game:"balance",   level:5 } },
  { id:"binary",    file:"binary-lights.html",   title:"Binary Lights",   needs:{ game:"primes",    level:5 } },
  { id:"belowzero", file:"below-zero.html",      title:"Below Zero",      needs:{ game:"binary",    level:5 } },
  { id:"fractions", file:"fraction-bricks.html", title:"Fraction Bricks", needs:{ game:"belowzero", level:5 } },
];

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const group = s => String(s).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const fmt = n => group(n);
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/* ---------------- saved progress ---------------- */
const Store = (() => {
  const KEY = "mathLab.v1";
  let st = null;
  function load() {
    if (st) return st;
    try { st = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { st = null; }
    if (!st || typeof st !== "object") st = {};
    st.games = st.games || {};
    st.seen = st.seen || {};
    if (st.sound === undefined) st.sound = true;
    if (st.voice === undefined) st.voice = true;
    return st;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(load())); } catch (e) {} }
  function game(id) { const s = load(); return s.games[id] || (s.games[id] = { stars:{}, best:0 }); }
  const stars = (id, L) => game(id).stars[L] || 0;
  const totalStars = id => Object.values(game(id).stars).reduce((a, b) => a + b, 0);
  const allStars = () => CATALOG.reduce((t, g) => t + totalStars(g.id), 0);
  function highest(id) { let h = 0; for (const k in game(id).stars) if (game(id).stars[k] > 0) h = Math.max(h, +k); return h; }
  function levelOpen(id, L) {
    if (L <= 1 || load().unlockAll) return true;
    if (L === 11) return stars(id, 10) > 0;
    return stars(id, L - 1) > 0 || stars(id, L) > 0;
  }
  function setStars(id, L, n) { const g = game(id); if (n > (g.stars[L] || 0)) g.stars[L] = n; save(); }
  function setBest(id, n) { const g = game(id); if (n > (g.best || 0)) { g.best = n; save(); return true; } return false; }
  function gameOpen(entry) { if (!entry.needs || load().unlockAll) return true; return highest(entry.needs.game) >= entry.needs.level; }
  function get(k) { return load()[k]; }
  function set(k, v) { load()[k] = v; save(); }
  function reset() { const s = load(); s.games = {}; s.seen = {}; s.unlockAll = false; save(); }
  return { load, save, game, stars, totalStars, allStars, highest, levelOpen, setStars, setBest, gameOpen, get, set, reset };
})();

/* ---------------- sound effects (Web Audio, no files) ---------------- */
const Sfx = (() => {
  let ctx = null;
  function ac() {
    if (!Store.get("sound")) return null;
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) { return null; }
    return ctx;
  }
  function tone(f, at, dur, type, vol) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type || "triangle"; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function unlock() { const c = ac(); if (c) tone(1, 0, 0.01, "sine", 0.0002); }
  ["touchend", "pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, unlock, { passive:true }));
  return {
    tap()  { tone(740, 0, 0.05, "triangle", 0.05); },
    snap() { tone(900, 0, 0.04, "square", 0.05); tone(1350, 0.03, 0.06, "triangle", 0.08); },
    good() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.07, 0.18, "triangle", 0.13)); },
    bad()  { tone(210, 0, 0.16, "sawtooth", 0.06); tone(160, 0.1, 0.22, "sawtooth", 0.06); },
    win()  { [523, 659, 784, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.26, "triangle", 0.14)); },
    meh()  { [392, 349, 330].forEach((f, i) => tone(f, i * 0.16, 0.25, "triangle", 0.1)); },
    zoom() { for (let i = 0; i < 10; i++) tone(300 + i * 90, i * 0.03, 0.08, "sine", 0.06); },
  };
})();

/* ---------------- read-aloud (deep male voice) ---------------- */
const Voice = (() => {
  let voice = null, picked = false;
  // Best deep male voices first; the browser only has a few of these installed.
  const WANT = [
    /\bAlex\b/i,                                           // macOS, deep male
    /\bAaron\b/i,                                          // iOS/iPadOS, US male
    /Microsoft\s+(Guy|David|Mark|Christopher|Eric|Ryan|Brandon|Steffan)\b/i,
    /Google (UK|US) English Male/i,
    /\bDaniel\b/i,                                         // British male
    /\b(Arthur|Oliver|Gordon|Lee|Rishi|Nathan|Tom|James)\b/i,
    /\b(Fred|Eddy|Reed|Rocko|Grandpa|Junior|Ralph|Albert)\b/i,
  ];
  function bestOf(list) {
    const en = (list || []).filter(v => /^en/i.test(v.lang || ""));
    const us = en.filter(v => /^en[-_](US|CA)/i.test(v.lang));
    for (const re of WANT) {
      const hit = us.find(v => re.test(v.name)) || en.find(v => re.test(v.name));
      if (hit) return hit;
    }
    return us[0] || en[0] || null;
  }
  function choose() { try { const l = speechSynthesis.getVoices(); if (l && l.length) { voice = bestOf(l); picked = true; } } catch (e) {} }
  if ("speechSynthesis" in window) { choose(); try { speechSynthesis.onvoiceschanged = choose; } catch (e) {} }
  // Automatic narration follows the Narration setting; force=true is for an explicit tap on a 🔊 button.
  function say(text, force) {
    if (!text || (!force && !Store.get("voice")) || !("speechSynthesis" in window)) return;
    try {
      if (!picked) choose();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g, " "));
      u.rate = 0.94; u.pitch = 0.72;          // slower and low = friendly deep voice
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stop() { try { speechSynthesis.cancel(); } catch (e) {} }
  return { say, stop, bestOf, name: () => (voice ? voice.name : "the browser's default voice") };
})();

/* ---------------- confetti bricks ---------------- */
function burst(x, y, n) {
  const cols = ["#d9281c", "#1f6fd1", "#1f9d45", "#ffc919", "#ff8a1f", "#8a4fd8", "#23a9d0"];
  for (let i = 0; i < (n || 18); i++) {
    const b = document.createElement("div");
    b.className = "bit"; b.style.background = pick(cols);
    b.style.left = x + "px"; b.style.top = y + "px";
    document.body.appendChild(b);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 130;
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d - 60;
    try {
      b.animate([
        { transform:"translate(0,0) rotate(0deg)", opacity:1 },
        { transform:`translate(${dx}px,${dy + 160}px) rotate(${rnd(-300, 300)}deg)`, opacity:0 }
      ], { duration:900 + Math.random() * 400, easing:"cubic-bezier(.2,.7,.4,1)" }).onfinish = () => b.remove();
    } catch (e) { setTimeout(() => b.remove(), 50); }
  }
}
function burstAt(elm, n) { const r = elm.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n); }

function toast(text) {
  const old = document.getElementById("toast"); if (old) old.remove();
  const t = document.createElement("div");
  t.id = "toast"; t.className = "toast"; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("out"), 2200);
  setTimeout(() => t.remove(), 2700);
}

const PRAISE = ["Awesome!", "Brilliant!", "Nailed it!", "Genius!", "Perfect!", "Super builder!", "Great thinking!", "You got it!"];
const OOPS = ["Not quite — try again!", "Almost! Check it again.", "Hmm, try a different number.", "Close — have another go!"];
const starStr = n => [1, 2, 3].map(i => `<span class="${i <= n ? "" : "no"}">⭐</span>`).join("");

/* =====================================================================
   MathGame(cfg) — level map, 8-puzzle rounds, number pad, stars.
   cfg: { id, title, icon, iconSvg, color, tagline, howTo, levels:[{name, blurb, say, demo}],
          make(level, i, boost) -> puzzle, endlessName, resultExtra(level) }
   puzzle: { html, prompt, say, answers:[..] | choices:[{label, ok}], order, key,
             hint(k, stage, S), wrong(k, v, stage, S), onType(k, buf, stage), onFill(k, stage, S),
             onSolved(stage, S), reveal, mount(stage), autoSay }
   ===================================================================== */
function MathGame(cfg) {
  const TOTAL = cfg.total || 8, EXPRESS = cfg.express || Math.min(5, TOTAL), ENDLESS = 11, HEARTS = 3;
  const app = document.getElementById("app");
  let S = null;

  document.title = cfg.title + " · Math Lab";
  app.innerHTML = `
    <header class="top">
      <a class="home" href="index.html" id="homeBtn">⬅ <span>Games</span></a>
      <div class="gtitle"><span class="gi">${cfg.icon} </span>${cfg.title}</div>
      <div class="pill" id="starsum">⭐ 0</div>
      <button class="iconbtn" id="sndBtn" aria-label="Sound effects">🔔</button>
      <button class="vbtn" id="voiceBtn" aria-label="Narration">🗣️ <span>On</span></button>
    </header>
    <main class="screen" id="screen"></main>`;
  const screen = $("#screen");
  const sndBtn = $("#sndBtn"), voiceBtn = $("#voiceBtn");
  function syncToggles() {
    sndBtn.classList.toggle("off", !Store.get("sound"));
    sndBtn.textContent = Store.get("sound") ? "🔔" : "🔕";
    voiceBtn.classList.toggle("off", !Store.get("voice"));
    voiceBtn.innerHTML = `🗣️ <span>${Store.get("voice") ? "On" : "Off"}</span>`;
    $("#starsum").textContent = "⭐ " + Store.totalStars(cfg.id);
  }
  sndBtn.onclick = () => { Store.set("sound", !Store.get("sound")); syncToggles(); Sfx.tap(); toast(Store.get("sound") ? "Sound effects on" : "Sound effects off"); };
  voiceBtn.onclick = () => {
    Store.set("voice", !Store.get("voice"));
    if (!Store.get("voice")) Voice.stop();
    syncToggles();
    toast(Store.get("voice") ? "Narration on" : "Narration off — tap 🔊 Read it if you want to hear a question");
  };
  syncToggles();

  document.addEventListener("keydown", e => {
    if (!S || !S.P) return;
    if (S.solved && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); goNext(); return; }
    if (S.P.choices) { const n = parseInt(e.key, 10); const b = $$(".choice")[n - 1]; if (b) b.click(); return; }
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); press("del"); }
    else if (e.key === "Enter") check();
  });

  /* ---------- level map ---------- */
  function showMap() {
    S = null; Voice.stop(); closeOverlay(); syncToggles();
    screen.className = "screen";
    const g = Store.game(cfg.id);
    let nextMarked = false, html = `
      <div class="maphead" style="--gc:${cfg.color}">
        <div class="bigicon">${cfg.iconSvg || cfg.icon}</div>
        <div class="grow"><h1>${cfg.title}</h1><p>${cfg.tagline}</p></div>
        <button class="iconbtn" id="sayHow" aria-label="Read how to play">🔊</button>
      </div><div class="levels">`;
    cfg.levels.forEach((L, idx) => {
      const n = idx + 1, open = Store.levelOpen(cfg.id, n), st = g.stars[n] || 0;
      const isNext = open && !st && !nextMarked; if (isNext) nextMarked = true;
      html += `<button class="lvl ${open ? "" : "locked"} ${isNext ? "next" : ""}" data-l="${n}" style="--lc:${L.color || cfg.color}">
        <span class="ln">${n}</span><span class="lname">${L.name}</span>
        <span class="lstars">${open ? starStr(st) : ""}</span></button>`;
    });
    const eo = Store.levelOpen(cfg.id, ENDLESS);
    html += `<button class="lvl endless ${eo ? "" : "locked"}" data-l="${ENDLESS}">
        <span class="ln">∞</span><span class="lname">${cfg.endlessName || "Endless Challenge"} — ${eo ? "how far can you go? Best: " + (g.best || 0) : "finish Level 10 to open"}</span></button>`;
    html += `</div><div class="howto">${cfg.howTo}</div>`;
    screen.innerHTML = html;
    $$(".lvl", screen).forEach(b => b.onclick = () => {
      if (b.classList.contains("locked")) { Sfx.bad(); b.animate([{ transform:"translateX(-5px)" }, { transform:"translateX(5px)" }, { transform:"none" }], 250); return; }
      Sfx.tap(); showIntro(+b.dataset.l);
    });
    $("#sayHow").onclick = () => Voice.say(cfg.howToSay || cfg.howTo, true);
    window.scrollTo(0, 0);
  }

  /* ---------- overlays ---------- */
  function overlay(html, color) {
    closeOverlay();
    const o = document.createElement("div");
    o.className = "overlay"; o.id = "ov";
    o.innerHTML = `<div class="ocard" style="--gc:${color || cfg.color}">${html}</div>`;
    document.body.appendChild(o);
    return o;
  }
  function closeOverlay() { const o = $("#ov"); if (o) o.remove(); }

  function showIntro(level) {
    const L = level === ENDLESS
      ? { name:cfg.endlessName || "Endless Challenge", blurb:"Puzzles keep coming and keep getting harder. You have 3 hearts — a wrong answer costs one. How far can you go?", say:"Endless challenge! Puzzles keep getting harder. You have three hearts. How far can you go?" }
      : cfg.levels[level - 1];
    const o = overlay(`
      <div class="kicker">${level === ENDLESS ? "Challenge mode" : "Level " + level + " of " + cfg.levels.length}</div>
      <h2>${L.name}</h2>
      <p>${L.blurb}</p>
      ${L.demo ? `<div class="demo">${L.demo}</div>` : ""}
      <div class="obtns"><button class="btn alt" id="ovBack">⬅ Levels</button><button class="btn" id="ovGo">Go! ▶</button></div>`,
      L.color);
    Voice.say(L.say || L.blurb);
    $("#ovBack", o).onclick = () => { Sfx.tap(); showMap(); };
    $("#ovGo", o).onclick = () => { Sfx.tap(); Voice.stop(); closeOverlay(); startRound(level); };
  }

  /* ---------- a round ---------- */
  function startRound(level) {
    const endless = level === ENDLESS;
    S = { level, endless, i:0, results:[], hearts:HEARTS, score:0, seen:new Set() };
    const name = endless ? (cfg.endlessName || "Endless") : cfg.levels[level - 1].name;
    screen.className = "screen playing";
    screen.innerHTML = `
      <div class="play">
        <div class="phead">
          <div class="ptitle">${endless ? "∞" : "Level " + level} · ${name}</div>
          <div id="prog"></div>
        </div>
        <div class="stagewrap">
          <div class="stage" id="stage"></div>
          <div class="prompt" id="prompt"></div>
          <div class="msg" id="msg"></div>
          <div class="reveal" id="reveal"></div>
        </div>
        <div class="side">
          <div class="tools" id="tools">
            <button class="tool" id="sayQ">🔊 Read it</button>
            <button class="tool" id="hintB">💡 Hint</button>
          </div>
          <div id="input"></div>
        </div>
      </div>`;
    $("#sayQ").onclick = () => S && S.P && Voice.say(S.P.say || $("#prompt").textContent, true);
    $("#hintB").onclick = () => { if (!S || S.solved) return; S.usedHint = true; showHint(S.cur); };
    drawProgress();
    nextPuzzle();
    window.scrollTo(0, 0);
  }

  function drawProgress() {
    const p = $("#prog"); if (!p) return;
    if (S.endless) {
      p.innerHTML = `<span class="hearts">${"❤️".repeat(S.hearts)}${"🤍".repeat(HEARTS - S.hearts)}</span> <span class="score">Score ${S.score}</span>`;
      p.style.display = "flex"; p.style.gap = "10px"; p.style.alignItems = "center";
      return;
    }
    let h = '<div class="studs">';
    for (let i = 0; i < TOTAL; i++) {
      const r = S.results[i];
      h += `<span class="stud ${r || (i === S.i ? "now" : "")}"></span>`;
    }
    p.innerHTML = h + "</div>";
  }

  function makePuzzle() {
    let P = null;
    for (let t = 0; t < 25; t++) {
      if (S.endless) {
        const d = Math.min(10, 4 + Math.floor(S.score / 3));
        const lvl = Math.max(3, d - rnd(0, 2));
        P = cfg.make(lvl, rnd(3, 7), Math.max(0, Math.floor((S.score - 18) / 5)));
      } else {
        P = cfg.make(S.level, S.i, 0);
      }
      if (!P.key || !S.seen.has(P.key)) break;
    }
    if (P.key) S.seen.add(P.key);
    return P;
  }

  function nextPuzzle() {
    const P = makePuzzle();
    Object.assign(S, { P, tries:{}, buf:{}, stale:{}, done:new Set(), mistakes:0, gaveUp:false, usedHint:false, cur:null, solved:false, locked:false });
    const stage = $("#stage");
    stage.className = "stage"; void stage.offsetWidth; stage.className = "stage enter";
    stage.innerHTML = P.html;
    $("#prompt").innerHTML = P.prompt || "";
    setMsg("");
    $("#reveal").innerHTML = "";
    $("#tools").style.visibility = "visible";
    S.blanks = [];
    $$("[data-blank]", stage).forEach(b => {
      const k = +b.dataset.blank;
      S.blanks[k] = b; b.classList.add("blank"); b.textContent = "";
      b.onclick = () => { if (!S.solved && !S.done.has(k)) { Sfx.tap(); select(k); } };
    });
    if (P.choices) drawChoices();
    else if (P.custom) $("#input").innerHTML = "";
    else { drawPad(); select(firstOpen()); }
    if (P.mount) P.mount(stage, S, API);
    drawProgress();
    if (S.i > 0) window.scrollTo(0, 0);
    if (P.autoSay) Voice.say(P.say);
  }

  // run fn later, but only if we're still on the same puzzle
  function later(fn, ms) { const tok = S && S.P; setTimeout(() => { if (S && tok && S.P === tok) fn(); }, ms); }

  function setMsg(html, cls) { const m = $("#msg"); m.className = "msg " + (cls || ""); m.innerHTML = html; }

  function firstOpen() {
    const order = S.P.order || S.P.answers.map((_, k) => k);
    for (const k of order) if (!S.done.has(k)) return k;
    return null;
  }
  function select(k) {
    if (k == null) return;
    S.blanks.forEach(b => b && b.classList.remove("sel"));
    S.cur = k; S.blanks[k].classList.add("sel");
    $$(".hl", $("#stage")).forEach(e => e.classList.remove("hl"));
  }

  function drawPad() {
    const neg = !!S.P.neg;
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "del", "0", neg ? "sign" : "go"];
    const cols = ["var(--red)", "var(--blue)", "var(--azure)", "var(--orange)", "var(--purple)", "var(--red)", "var(--blue)", "var(--azure)", "var(--orange)"];
    $("#input").innerHTML = '<div class="pad">' + keys.map((k, i) =>
      k === "del" ? '<button class="key del" data-k="del" aria-label="Delete">⌫</button>'
      : k === "go" ? '<button class="key go" data-k="go" aria-label="Check">✓</button>'
      : k === "sign" ? '<button class="key sign" data-k="sign" aria-label="Minus">+/−</button>'
      : `<button class="key" data-k="${k}" style="--c:${k === "0" ? "var(--purple)" : cols[i]}">${k}</button>`).join("")
      + (neg ? '<button class="key go wide" data-k="go" aria-label="Check">✓</button>' : "") + "</div>";
    $$(".key").forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === "go") check(); else { Sfx.tap(); press(k); } });
  }

  function press(d) {
    if (!S || S.solved || S.locked || S.cur == null) return;
    const k = S.cur, P = S.P;
    let b = S.stale[k] ? "" : (S.buf[k] || "");
    S.stale[k] = false;
    const max = P.maxLen || Math.min(12, Math.max(3, String(P.answers[k]).length + 2));
    if (d === "del") b = b.slice(0, -1);
    else if (d === "sign") b = b.startsWith("-") ? b.slice(1) : "-" + b;
    else if (b.replace("-", "").length < max) b = (b === "0" ? "" : b === "-0" ? "-" : b) + d;
    S.buf[k] = b;
    const el = S.blanks[k];
    el.classList.remove("bad");
    el.textContent = b ? group(b) : "";
    if (P.onType) P.onType(k, b, $("#stage"), S);
  }

  function check() {
    if (!S || S.solved || S.locked || S.cur == null) return;
    const k = S.cur, b = S.stale[k] ? "" : S.buf[k];
    if (!b || b === "-") { const e = S.blanks[k]; e.classList.remove("bad"); void e.offsetWidth; e.classList.add("bad"); setTimeout(() => e.classList.remove("bad"), 400); return; }
    const v = Number(b);
    if (v === S.P.answers[k]) correct(k); else wrong(k, v);
  }

  function correct(k) {
    const el = S.blanks[k];
    S.done.add(k);
    el.classList.remove("sel", "bad"); el.classList.add("ok");
    Sfx.snap();
    $$(".hl", $("#stage")).forEach(e => e.classList.remove("hl"));
    if (S.P.onFill) S.P.onFill(k, $("#stage"), S);
    const nk = firstOpen();
    if (nk == null) solved();
    else { setMsg(S.P.answers.length > 1 ? "✔ Good!" : "", "good"); select(nk); }
  }

  function loseHeart() {
    S.hearts--; drawProgress();
    if (S.hearts <= 0) { S.solved = true; later(gameOver, 900); return true; }
    return false;
  }

  function wrong(k, v) {
    const el = S.blanks[k];
    S.tries[k] = (S.tries[k] || 0) + 1; S.stale[k] = true;
    const free = S.P.freeTries && k === 0 && S.tries[k] <= S.P.freeTries;   // guess-and-check puzzles
    if (!free) S.mistakes++;
    el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad");
    Sfx.bad();
    if (S.endless && !free && loseHeart()) { setMsg("Out of hearts!", "bad"); return; }
    let m = (S.P.wrong && S.P.wrong(k, v, $("#stage"), S)) || pick(OOPS);
    if (!S.endless && S.tries[k] >= (S.P.maxTries || 3)) {
      S.buf[k] = String(S.P.answers[k]); S.stale[k] = false;
      el.textContent = group(S.P.answers[k]);
      el.classList.remove("bad", "sel"); el.classList.add("given");
      S.done.add(k); S.gaveUp = true;
      setMsg(`The answer is <b>${group(S.P.answers[k])}</b>. Let's keep building!`, "bad");
      if (S.P.onFill) S.P.onFill(k, $("#stage"), S);
      const nk = firstOpen();
      if (nk == null) { S.locked = true; later(solved, 900); } else select(nk);
      return;
    }
    setMsg(m, "bad");
    if (S.tries[k] >= (S.P.hintAfter || 2)) showHint(k, true);
  }

  function showHint(k, append) {
    const P = S.P;
    const h = P.hint ? P.hint(k, $("#stage"), S) : null;
    if (!h) return;
    const m = $("#msg");
    if (!append) { m.className = "msg"; m.innerHTML = ""; }
    const old = $(".hint", m); if (old) old.remove();
    m.insertAdjacentHTML("beforeend", `<span class="hint">💡 ${h}</span>`);
  }

  function drawChoices() {
    const P = S.P;
    $("#input").innerHTML = `<div class="choices ${P.choiceStyle || ""}">` + P.choices.map((c, i) => `<button class="choice" data-i="${i}">${c.label}</button>`).join("") + "</div>";
    $$(".choice").forEach(b => b.onclick = () => {
      if (S.solved || S.locked || b.disabled) return;
      const c = P.choices[+b.dataset.i];
      if (c.ok) { b.classList.add("ok"); solved(); return; }
      b.classList.add("no"); b.disabled = true; S.mistakes++;
      S.tries[0] = (S.tries[0] || 0) + 1;
      Sfx.bad();
      if (S.endless && loseHeart()) { setMsg("Out of hearts!", "bad"); return; }
      setMsg((P.wrong && P.wrong(0, c.label, $("#stage"), S)) || "Not that one — try again!", "bad");
      if (S.tries[0] >= 1) showHint(0, true);
      const left = $$(".choice").filter(x => !x.disabled && !P.choices[+x.dataset.i].ok);
      if (!left.length) { S.gaveUp = true; S.locked = true; const okb = $$(".choice").find(x => P.choices[+x.dataset.i].ok); okb.classList.add("ok"); later(solved, 700); }
    });
  }

  // API handed to custom puzzles (board games, tap-grids) so they can drive the round themselves
  const API = {
    msg: (html, cls) => setMsg(html, cls),
    hint: () => showHint(S && S.cur, true),
    controls: html => { $("#input").innerHTML = html; },
    stage: () => $("#stage"),
    busy: () => !S || S.solved,
    later: (fn, ms) => later(fn, ms),
    mistake(n) {
      if (!S || S.solved) return false;
      S.mistakes += (n || 1);
      if (S.endless && loseHeart()) { setMsg("Out of hearts!", "bad"); return true; }
      return false;
    },
    finish(opts) {                        // {win:false} marks the puzzle as a miss
      if (!S || S.solved) return;
      opts = opts || {};
      if (opts.win === false) S.gaveUp = true;
      if (opts.reveal) S.P.reveal = opts.reveal;
      if (opts.msg) S.P.keepMsg = opts.msg;
      solved();
    },
  };

  function solved() {
    if (S.solved) return;
    S.solved = true;
    const res = S.gaveUp ? "miss" : (S.mistakes || S.usedHint) ? "silver" : "gold";
    if (S.endless) S.score++; else S.results[S.i] = res;
    drawProgress();
    const stage = $("#stage");
    stage.classList.remove("enter"); void stage.offsetWidth; stage.classList.add("win");
    if (res === "miss") Sfx.meh(); else { Sfx.good(); burstAt(stage, res === "gold" ? 22 : 12); }
    const praise = S.P.keepMsg || (res === "gold" ? pick(PRAISE) : res === "silver" ? "You got it! 👍" : "Now you know it! 💪");
    setMsg(praise, res === "miss" ? "bad" : "good");
    if (S.P.onSolved) S.P.onSolved(stage, S);
    if (S.P.reveal) $("#reveal").innerHTML = S.P.reveal;
    $("#tools").style.visibility = "hidden";
    const last = !S.endless && (S.i + 1 >= TOTAL);
    $("#input").innerHTML = `<button class="nextbtn" id="nextBtn">${last ? "Finish 🏁" : "Next ▶"}</button>`;
    $("#nextBtn").onclick = () => { Sfx.tap(); goNext(); };
  }

  function goNext() {
    if (!S || !S.solved || S.hearts <= 0) return;
    Voice.stop();
    if (S.endless) { S.i++; nextPuzzle(); return; }
    S.i++;
    if (S.i === EXPRESS && S.results.slice(0, EXPRESS).every(r => r === "gold")) return finish(true);
    if (S.i >= TOTAL) return finish(false);
    nextPuzzle();
  }

  function finish(express) {
    const level = S.level;
    const gold = S.results.filter(r => r === "gold").length;
    const stars = express ? 3 : gold >= TOTAL - 1 ? 3 : gold === TOTAL - 2 ? 2 : gold === TOTAL - 3 ? 1 : 0;
    const wasOpen = level < 10 ? Store.levelOpen(cfg.id, level + 1) : Store.levelOpen(cfg.id, ENDLESS);
    const gamesBefore = CATALOG.map(g => Store.gameOpen(g));
    Store.setStars(cfg.id, level, stars);
    const gamesAfter = CATALOG.map(g => Store.gameOpen(g));
    syncToggles();
    let badges = "";
    if (express) badges += `<span class="badge">⚡ EXPRESS PASS — ${EXPRESS} perfect in a row!</span>`;
    if (stars > 0 && !wasOpen) badges += `<span class="badge new">🔓 ${level < 10 ? "Level " + (level + 1) + " unlocked!" : "Endless Challenge unlocked!"}</span>`;
    CATALOG.forEach((g, i) => { if (!gamesBefore[i] && gamesAfter[i] && !g.soon) badges += `<span class="badge new">🎉 NEW GAME: ${g.title}! Find it on the games page.</span>`; });
    const studs = S.results.map(r => `<span class="stud ${r}"></span>`).join("") + (express ? `<span class="stud bolt"></span>`.repeat(TOTAL - S.results.length) : "");
    const title = stars === 3 ? "Master Builder!" : stars > 0 ? "Level Complete!" : "Keep Practicing!";
    const text = stars > 0
      ? `You ${cfg.scoreVerb || "solved"} <b>${gold}</b> of ${S.results.length} perfectly.`
      : `You need ${TOTAL - 3} perfect ${cfg.scoreNoun || "puzzles"} to clear this level. You got <b>${gold}</b>. Try again — you're getting stronger!`;
    const o = overlay(`
      <div class="kicker">Level ${level} · ${cfg.levels[level - 1].name}</div>
      <h2>${title}</h2>
      <div class="bigstars">${[1, 2, 3].map(i => `<span class="${i <= stars ? "" : "no"}" style="animation-delay:${i * 0.18}s">⭐</span>`).join("")}</div>
      <div class="resstuds">${studs}</div>
      <p>${text}</p>
      <div>${badges}</div>
      ${cfg.resultExtra ? cfg.resultExtra(level, stars) : ""}
      <div class="obtns">
        <button class="btn alt" id="rMap">▦ Levels</button>
        <button class="btn blue" id="rAgain">↻ Again</button>
        ${stars > 0 && level < 10 ? `<button class="btn" id="rNext">Level ${level + 1} ▶</button>` : ""}
        ${stars > 0 && level === 10 ? `<button class="btn" id="rEnd">∞ Endless ▶</button>` : ""}
      </div>`);
    if (stars > 0) { Sfx.win(); setTimeout(() => burst(innerWidth / 2, innerHeight / 3, 40), 250); } else Sfx.meh();
    Voice.say(stars > 0 ? `${title} ${stars} star${stars > 1 ? "s" : ""}!` : "Keep practicing! You can do it.");
    $("#rMap", o).onclick = () => { Sfx.tap(); showMap(); };
    $("#rAgain", o).onclick = () => { Sfx.tap(); closeOverlay(); startRound(level); };
    const rn = $("#rNext", o); if (rn) rn.onclick = () => { Sfx.tap(); showIntro(level + 1); };
    const re = $("#rEnd", o); if (re) re.onclick = () => { Sfx.tap(); showIntro(ENDLESS); };
    S.P = null;
  }

  function gameOver() {
    const rec = Store.setBest(cfg.id, S.score);
    const o = overlay(`
      <div class="kicker">${cfg.endlessName || "Endless Challenge"}</div>
      <h2>${rec ? "New Record! 🏆" : "Great Run!"}</h2>
      <div class="bigstars" style="font-size:44px">${S.score}</div>
      <p>puzzles solved · best: <b>${Store.game(cfg.id).best}</b></p>
      <div class="obtns"><button class="btn alt" id="gMap">▦ Levels</button><button class="btn" id="gAgain">↻ Play again</button></div>`);
    if (rec) { Sfx.win(); burst(innerWidth / 2, innerHeight / 3, 40); } else Sfx.meh();
    Voice.say(rec ? `New record! ${S.score} puzzles!` : `Great run! ${S.score} puzzles.`);
    $("#gMap", o).onclick = () => { Sfx.tap(); showMap(); };
    $("#gAgain", o).onclick = () => { Sfx.tap(); closeOverlay(); startRound(ENDLESS); };
    S.P = null;
  }

  // test hooks (used by automated checks; harmless in play)
  window.__game = { get S() { return S; }, showMap, startRound, check, press, goNext };
  showMap();
}

</script>
<script>
/* =====================================================================
   Game 7 — Mystery Machine: put numbers in, watch what comes out,
   work out the secret rule, then prove it by predicting.
   ===================================================================== */
(() => {
  const why = t => `<div class="why">${t}</div>`;
  const digits = n => String(n).length;
  const dsum = n => String(Math.abs(n)).split("").reduce((a, c) => a + +c, 0);

  /* ---------- the machines ---------- */
  const R = {
    plus:  a => ({ f:x => x + a, label:`add ${a}`, test:`+${a}` }),
    minus: a => ({ f:x => x - a, label:`take away ${a}`, test:`−${a}`, neg:true }),
    times: a => ({ f:x => x * a, label:`multiply by ${a}`, test:`×${a}` }),
    linear:(a, b) => ({ f:x => x * a + b, label:`multiply by ${a}, then ${b < 0 ? "take away " + -b : "add " + b}`, test:`×${a}${b < 0 ? b : "+" + b}`, neg:b < 0 }),
    square:b => ({ f:x => x * x + b, label:`multiply the number by itself${b ? `, then add ${b}` : ""}`, test:`x×x${b ? "+" + b : ""}` }),
    triple: () => ({ f:x => x + x + x, label:`add the number to itself three times`, test:"×3" }),
    always:c => ({ f:() => c, label:`always give ${c}, whatever goes in`, test:`always ${c}` }),
    digitsIn: () => ({ f:x => digits(x), label:`count how many digits the number has`, test:"digits" }),
    digitSum: () => ({ f:x => dsum(x), label:`add up the digits of the number`, test:"digit sum" }),
    chain:(a, b, c) => ({ f:x => (x + a) * b + c, label:`add ${a}, then multiply by ${b}${c ? `, then add ${c}` : ""}`, test:`(+${a})×${b}${c ? "+" + c : ""}` }),
    sum:   () => ({ f:(x, y) => x + y, label:`add the two numbers`, test:"a+b", two:true }),
    prod:  () => ({ f:(x, y) => x * y, label:`multiply the two numbers`, test:"a×b", two:true }),
    diff:  () => ({ f:(x, y) => x - y, label:`take the second number away from the first`, test:"a−b", two:true, neg:true }),
    sumPlus:c => ({ f:(x, y) => x + y + c, label:`add the two numbers, then add ${c}`, test:`a+b+${c}`, two:true }),
    prodPlus:c => ({ f:(x, y) => x * y + c, label:`multiply the two numbers, then add ${c}`, test:`a×b+${c}`, two:true }),
    doubleFirst:() => ({ f:(x, y) => x * 2 + y, label:`double the first number, then add the second`, test:"2a+b", two:true }),
  };
  const MACHINES = {
    1:() => pick([R.plus(rnd(1, 9)), R.plus(rnd(10, 20)), R.minus(rnd(1, 5))]),
    2:() => pick([R.times(pick([2, 3, 4, 5, 10])), R.times(pick([2, 3])), R.triple()]),
    3:() => pick([R.linear(rnd(2, 4), rnd(1, 9)), R.linear(rnd(2, 5), -rnd(1, 4)), R.linear(10, rnd(1, 9))]),
    4:() => pick([R.square(0), R.square(0), R.square(rnd(1, 3)), R.triple()]),
    5:() => pick([R.plus(rnd(3, 15)), R.times(pick([3, 4, 6])), R.linear(rnd(2, 4), rnd(1, 9))]),      // backwards level
    6:() => pick([R.sum(), R.prod(), R.diff(), R.sumPlus(rnd(1, 5)), R.doubleFirst()]),
    7:() => pick([R.chain(rnd(1, 5), rnd(2, 4), 0), R.chain(rnd(1, 4), rnd(2, 3), rnd(1, 6)), R.linear(rnd(3, 6), rnd(2, 12))]),
    8:() => pick([R.always(rnd(3, 9)), R.digitsIn(), R.digitSum(), R.square(0)]),
    9:() => pick([R.plus(rnd(2, 9)), R.times(pick([3, 4, 5])), R.linear(rnd(2, 4), rnd(1, 5)), R.square(0), R.digitSum(), R.sum()]),
    10:() => pick([R.chain(rnd(1, 5), rnd(2, 4), rnd(0, 5)), R.prodPlus(rnd(1, 5)), R.square(rnd(0, 3)), R.digitSum(), R.doubleFirst(), R.linear(rnd(5, 9), rnd(1, 9))]),
  };

  const padHTML = (go, hint) => `<div class="pad mini">` +
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "del", "0", "sign"].map(k =>
      k === "del" ? `<button class="key del" data-mk="del">⌫</button>`
      : k === "sign" ? `<button class="key sign" data-mk="sign">+/−</button>`
      : `<button class="key" data-mk="${k}" style="--c:${k === "0" ? "var(--purple)" : "var(--blue)"}">${k}</button>`).join("") +
    `<button class="key go wide" data-mk="go">${go}</button></div>` + (hint ? `<div class="mmtip">${hint}</div>` : "");

  function make(level, i, boost) {
    const lv = Math.min(10, level);
    const m = MACHINES[lv]();
    const two = !!m.two, backwards = lv === 5;
    const pickRule = lv === 9;
    const st = { log:[], phase:"test", buf:["", ""], slot:0, need:0, asked:null, wrong:0 };
    const val = (x, y) => two ? m.f(x, y) : m.f(x);

    if (pickRule) {                                   // "which rule is it?" — read the log, choose
      const xs = shuffle([1, 2, 3, 5, 7, 9, 10, 12]).slice(0, 4).sort((a, b) => a - b);
      const rows = xs.map(x => [x, two ? m.f(x, x + 1) : m.f(x)]);
      const others = [];
      for (let t = 0; t < 60 && others.length < 3; t++) {
        const o = MACHINES[rnd(1, 8)]();
        if (o.label === m.label || others.some(q => q.label === o.label)) continue;
        if (rows.every(([x, y]) => (o.two ? o.f(x, x + 1) : o.f(x)) === y)) continue;   // must disagree somewhere
        others.push(o);
      }
      return {
        html:`<div class="mm"><div class="mmbox big">🎛️ MYSTERY MACHINE</div>
          <div class="mmlog">${rows.map(([x, y]) => `<div class="mmrow2"><b>${two ? `${x} & ${x + 1}` : x}</b> ➜ <b>${y}</b></div>`).join("")}</div>
          <div class="mmq">Which rule is this machine using?</div></div>`,
        say:"Which rule is this machine using? Look at what goes in and what comes out.",
        key:"pr" + m.label, choiceStyle:"",
        choices:shuffle([{ label:m.label, ok:true }, ...others.map(o => ({ label:o.label, ok:false }))]),
        hint:() => `Check each rule against <b>every</b> line — the right one has to work for all of them. Start with ${rows[0][0]} ➜ ${rows[0][1]}.`,
        reveal:why(`The machine: <b>${m.label}</b>.`),
      };
    }

    const P = {
      custom:true, key:"mm" + m.label + Math.random(),
      neg:m.neg,
      html:`<div class="mm">
        <div class="mmtop">
          <div class="mmin" id="mmin">${two ? `<span class="slotbox sel" data-s="0">?</span><span class="slotbox" data-s="1">?</span>` : `<span class="slotbox sel" data-s="0">?</span>`}</div>
          <div class="mmarrow">➜</div><div class="mmbox">🎛️<br>MYSTERY<br>MACHINE</div><div class="mmarrow">➜</div>
          <div class="mmout" id="mmout">?</div>
        </div>
        <div class="mmlog" id="mmlog"></div>
        <div class="mmq" id="mmq">${backwards
          ? "Test the machine, then work out what went <b>in</b>."
          : two ? "Put <b>two</b> numbers in and see what comes out. Tap a box to choose which one you're typing."
          : "Put numbers in and see what comes out. When you know the rule, press <b>I know it!</b>"}</div>
      </div>`,
      say:backwards ? "Test the machine, then work out what number went in." : "Put numbers in and see what comes out. When you know the rule, press I know it.",
      hint(k, stage, S) {
        S.mmh = (S.mmh || 0) + 1;
        if (S.mmh === 1) return "Try the small numbers first: put in <b>1</b>, then <b>2</b>, then <b>10</b>. What changes?";
        if (S.mmh === 2) return two ? "Keep one number the same and change the other. What does that do?" : "Does the machine <b>add</b> something each time, or does it <b>multiply</b>? Compare what 1 and 2 give you.";
        return `The machine's rule: <b>${m.label}</b>. Now predict!`;
      },
      mount(stage, S, api) { run(stage, S, api); },
    };

    function run(stage, S, api) {
      const logEl = $("#mmlog", stage), outEl = $("#mmout", stage), qEl = $("#mmq", stage);
      draw();
      function slots() { return $$(".slotbox", stage); }
      function draw() {
        api.controls(padHTML(st.phase === "test" ? "TEST ▶" : "ANSWER ▶",
          st.phase === "test" && st.log.length >= 2 ? `<button class="knowit" id="knowBtn">💡 I know the rule!</button>` : ""));
        $$("[data-mk]").forEach(b => b.onclick = () => key(b.dataset.mk));
        const kb = $("#knowBtn"); if (kb) kb.onclick = startPredict;
        slots().forEach(b => b.onclick = () => { st.slot = +b.dataset.s; slots().forEach(x => x.classList.toggle("sel", x === b)); });
      }
      function key(k) {
        if (api.busy()) return;
        Sfx.tap();
        let b = st.buf[st.slot] || "";
        if (k === "del") b = b.slice(0, -1);
        else if (k === "sign") b = b.startsWith("-") ? b.slice(1) : "-" + b;
        else if (k === "go") return go();
        else if (b.replace("-", "").length < 3) b = (b === "0" ? "" : b === "-0" ? "-" : b) + k;
        st.buf[st.slot] = b;
        const s = slots()[st.slot]; if (s) s.textContent = b || "?";
        if (st.phase === "predict") outEl.textContent = b || "?";
      }
      function go() {
        if (st.phase === "test") {
          const x = Number(st.buf[0]), y = Number(st.buf[1]);
          if (st.buf[0] === "" || (two && st.buf[1] === "")) { Sfx.bad(); api.msg("Type a number first!", "bad"); return; }
          const out = val(x, y);
          Sfx.snap();
          outEl.textContent = out; outEl.classList.remove("pop"); void outEl.offsetWidth; outEl.classList.add("pop");
          st.log.push([two ? `${x} & ${y}` : x, out]);
          logEl.innerHTML = st.log.map(([a, b2]) => `<div class="mmrow2"><b>${a}</b> ➜ <b>${b2}</b></div>`).join("");
          st.buf = ["", ""]; slots().forEach(s => s.textContent = "?");
          api.msg(st.log.length >= 2 ? "Got it? Press <b>I know the rule!</b> when you're ready." : "");
          draw();
          return;
        }
        // prediction
        if (st.buf[0] === "") { Sfx.bad(); return; }
        const guess = Number(st.buf[0]);
        if (guess === st.answer) {
          st.need--;
          Sfx.good();
          outEl.textContent = guess; outEl.classList.add("good");
          if (st.need <= 0) {
            api.finish({ msg:"Rule cracked! 🔓", reveal:why(`The machine: <b>${m.label}</b>.`) });
            return;
          }
          api.msg("Right! One more…", "good");
          api.later(nextPredict, 700);
        } else {
          Sfx.bad(); st.wrong++;
          api.mistake();
          api.msg(`Not that one — it made <b>${st.answer}</b>. Back to testing!`, "bad");
          st.phase = "test"; st.buf = ["", ""]; qEl.innerHTML = "Test it some more, then try again.";
          slots().forEach(s => { s.textContent = "?"; s.classList.remove("ask"); });
          outEl.textContent = "?";
          if (st.wrong >= 3) { api.finish({ win:false, msg:"Tricky one!", reveal:why(`The machine: <b>${m.label}</b>.`) }); return; }
          draw();
        }
      }
      function startPredict() { st.phase = "predict"; st.need = 2; nextPredict(); }
      function nextPredict() {
        const used = new Set(st.log.map(l => String(l[0])));
        let x, y;
        do { x = rnd(2, 12 + (st.need === 1 ? 8 : 0)); y = rnd(2, 9); } while (used.has(two ? `${x} & ${y}` : String(x)));
        st.asked = two ? `${x} & ${y}` : x;
        st.answer = backwards ? x : val(x, y);
        st.buf = ["", ""]; st.slot = 0;
        const shown = backwards ? val(x, y) : st.asked;
        $("#mmin", stage).innerHTML = backwards ? `<span class="slotbox sel" data-s="0">?</span>` : `<span class="asked">${shown}</span>`;
        outEl.textContent = backwards ? val(x, y) : "?";
        outEl.classList.remove("good");
        qEl.innerHTML = backwards
          ? `The machine made <b>${val(x, y)}</b>. What went <b>in</b>? (${st.need} to go)`
          : `What comes out if you put in <b>${st.asked}</b>? (${st.need} to go)`;
        Voice.say(backwards ? `The machine made ${val(x, y)}. What went in?` : `What comes out if you put in ${x}?`);
        draw();
      }
      // used by the automated tests
      P.autoSolve = () => {
        if (st.phase === "test" && st.log.length < 2) { st.buf = [String(st.log.length + 1), "2"]; go(); return; }
        if (st.phase === "test") { startPredict(); return; }
        st.buf[0] = String(st.answer); go();
      };
    }
    return P;
  }

  const LEVELS = [
    { name:"Plus Machine", color:"#1f6fd1", blurb:"Feed the machine a number and watch what comes out. Work out its secret rule, then <b>prove it</b> by predicting twice in a row.",
      say:"Level 1. Plus machine. Feed the machine a number and see what comes out. Work out its secret rule, then prove it by predicting." },
    { name:"Times Machine", color:"#1f9d45", blurb:"This machine multiplies. Which number is it multiplying by?",
      say:"Level 2. Times machine. This one multiplies. Which number is it multiplying by?" },
    { name:"Two-Step Machine", color:"#ffc919", blurb:"Now the machine does <b>two</b> things: it multiplies and then adds. Try 0 and 1 first!",
      say:"Level 3. Two step machine. Now it multiplies and then adds. Try zero and one first!" },
    { name:"Square Machine", color:"#ff8a1f", blurb:"Something sneaky: the machine uses your number <b>twice</b>.",
      say:"Level 4. Square machine. The machine uses your number twice." },
    { name:"Backwards Machine", color:"#d9281c", blurb:"This time you see what came <b>out</b> — work out what went <b>in</b>.",
      say:"Level 5. Backwards machine. You see what came out. Work out what went in." },
    { name:"Two Numbers In", color:"#8a4fd8", blurb:"The machine eats <b>two</b> numbers at once. Keep one the same and change the other!",
      say:"Level 6. Two numbers in. The machine eats two numbers at once. Keep one the same and change the other." },
    { name:"Machine Chain", color:"#23a9d0", blurb:"Two machines joined together — the answer from the first one goes straight into the second.",
      say:"Level 7. Machine chain. Two machines joined together." },
    { name:"Tricky Machines", color:"#1f6fd1", blurb:"Some machines don't do arithmetic at all. They might count your digits — or ignore you completely!",
      say:"Level 8. Tricky machines. Some machines don't do arithmetic at all!" },
    { name:"Which Rule?", color:"#1f9d45", blurb:"Here's a finished test sheet. Which rule fits <b>every</b> line?",
      say:"Level 9. Which rule? Here is a finished test sheet. Which rule fits every line?" },
    { name:"Master Machine", color:"#8a4fd8", blurb:"Anything goes. Test carefully, think, then predict.",
      say:"Level 10. Master machine. Anything goes. Test carefully, think, then predict." },
  ];

  window.MYSTERY = window.GAME = { LEVELS, make, MACHINES, R };

  MathGame({
    id:"mystery", title:"Mystery Machine", icon:"🎛️", color:"#8a4fd8",
    iconSvg:`<svg viewBox="0 0 64 64"><rect x="10" y="16" width="44" height="34" rx="7" fill="#8a4fd8"/><circle cx="24" cy="30" r="5" fill="#ffe16b"/><circle cx="40" cy="30" r="5" fill="#7fe3ff"/><rect x="20" y="40" width="24" height="5" rx="2.5" fill="#fff"/><path d="M4 33 h6 M54 33 h6" stroke="#23314f" stroke-width="4" stroke-linecap="round"/></svg>`,
    tagline:"Test it, crack the rule, then prove you know it.",
    howTo:`<b>How to play:</b> type a number and press <b>TEST</b> — the machine shows what comes out. Test as many numbers as you like; nothing is wasted. When you think you know the secret rule, press <b>I know the rule!</b> and the machine asks you to predict two answers in a row. Get both right and the rule is cracked. This is how real scientists work: guess, test, then check.`,
    howToSay:"Type a number and press test. The machine shows what comes out. Test as many numbers as you like. When you think you know the rule, press I know the rule, and predict two answers in a row!",
    levels:LEVELS, make,
