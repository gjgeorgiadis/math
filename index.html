<body>
<div class="wrap">
  <div class="titlebar">
    <h1><span class="n" style="background:#1f6fd1">Math</span> <span class="n" style="background:#d9281c">Lab</span></h1>
    <div class="total" id="total">⭐ 0</div>
    <button class="narr" id="narr">🗣️ Narration: On</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="tiles-note">Tap a picture to explore 🔍</div>
  <div class="subhead" id="subhead">Pick a game to play! 🎮</div>
  <div id="grid" class="grid"></div>
  <footer><span id="gear" title="Grown-ups: press and hold">⚙︎</span> Math Lab 🧱 • master a game to unlock the next one</footer>
</div>

<script>
"use strict";
/* =====================================================================
   Math Lab — shared engine (inlined into every page)
   ===================================================================== */

// The game list. Each game unlocks when the previous game's level is cleared.
const CATALOG = [
  { id:"pyramids", file:"brick-pyramids.html",  title:"Brick Pyramids",  needs:null },
  { id:"patterns", file:"pattern-machine.html", title:"Pattern Machine", needs:{ game:"pyramids", level:5 } },
  { id:"googol",   file:"googol-zoom.html",     title:"Googol Zoom",     needs:{ game:"patterns", level:5 } },
  { id:"gears",    file:"",                     title:"Gear Lab",        needs:{ game:"googol",   level:5 }, soon:true },
];

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const group = s => String(s).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const fmt = n => group(n);
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/* ---------------- saved progress ---------------- */
const Store = (() => {
  const KEY = "mathLab.v1";
  let st = null;
  function load() {
    if (st) return st;
    try { st = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { st = null; }
    if (!st || typeof st !== "object") st = {};
    st.games = st.games || {};
    st.seen = st.seen || {};
    if (st.sound === undefined) st.sound = true;
    if (st.voice === undefined) st.voice = true;
    return st;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(load())); } catch (e) {} }
  function game(id) { const s = load(); return s.games[id] || (s.games[id] = { stars:{}, best:0 }); }
  const stars = (id, L) => game(id).stars[L] || 0;
  const totalStars = id => Object.values(game(id).stars).reduce((a, b) => a + b, 0);
  const allStars = () => CATALOG.reduce((t, g) => t + totalStars(g.id), 0);
  function highest(id) { let h = 0; for (const k in game(id).stars) if (game(id).stars[k] > 0) h = Math.max(h, +k); return h; }
  function levelOpen(id, L) {
    if (L <= 1 || load().unlockAll) return true;
    if (L === 11) return stars(id, 10) > 0;
    return stars(id, L - 1) > 0 || stars(id, L) > 0;
  }
  function setStars(id, L, n) { const g = game(id); if (n > (g.stars[L] || 0)) g.stars[L] = n; save(); }
  function setBest(id, n) { const g = game(id); if (n > (g.best || 0)) { g.best = n; save(); return true; } return false; }
  function gameOpen(entry) { if (!entry.needs || load().unlockAll) return true; return highest(entry.needs.game) >= entry.needs.level; }
  function get(k) { return load()[k]; }
  function set(k, v) { load()[k] = v; save(); }
  function reset() { const s = load(); s.games = {}; s.seen = {}; s.unlockAll = false; save(); }
  return { load, save, game, stars, totalStars, allStars, highest, levelOpen, setStars, setBest, gameOpen, get, set, reset };
})();

/* ---------------- sound effects (Web Audio, no files) ---------------- */
const Sfx = (() => {
  let ctx = null;
  function ac() {
    if (!Store.get("sound")) return null;
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) { return null; }
    return ctx;
  }
  function tone(f, at, dur, type, vol) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type || "triangle"; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function unlock() { const c = ac(); if (c) tone(1, 0, 0.01, "sine", 0.0002); }
  ["touchend", "pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, unlock, { passive:true }));
  return {
    tap()  { tone(740, 0, 0.05, "triangle", 0.05); },
    snap() { tone(900, 0, 0.04, "square", 0.05); tone(1350, 0.03, 0.06, "triangle", 0.08); },
    good() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.07, 0.18, "triangle", 0.13)); },
    bad()  { tone(210, 0, 0.16, "sawtooth", 0.06); tone(160, 0.1, 0.22, "sawtooth", 0.06); },
    win()  { [523, 659, 784, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.26, "triangle", 0.14)); },
    meh()  { [392, 349, 330].forEach((f, i) => tone(f, i * 0.16, 0.25, "triangle", 0.1)); },
    zoom() { for (let i = 0; i < 10; i++) tone(300 + i * 90, i * 0.03, 0.08, "sine", 0.06); },
  };
})();

/* ---------------- read-aloud ---------------- */
const Voice = (() => {
  let voice = null;
  function choose() {
    try {
      const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
      voice = vs.find(v => /Samantha|Ava|Allison|Google US English/i.test(v.name)) || vs[0] || null;
    } catch (e) {}
  }
  if ("speechSynthesis" in window) { choose(); try { speechSynthesis.onvoiceschanged = choose; } catch (e) {} }
  // Automatic narration follows the Narration setting; force=true is for an explicit tap on a 🔊 button.
  function say(text, force) {
    if (!text || (!force && !Store.get("voice")) || !("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g, " "));
      u.rate = 0.95; u.pitch = 1.05; if (voice) u.voice = voice;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stop() { try { speechSynthesis.cancel(); } catch (e) {} }
  return { say, stop };
})();

/* ---------------- confetti bricks ---------------- */
function burst(x, y, n) {
  const cols = ["#d9281c", "#1f6fd1", "#1f9d45", "#ffc919", "#ff8a1f", "#8a4fd8", "#23a9d0"];
  for (let i = 0; i < (n || 18); i++) {
    const b = document.createElement("div");
    b.className = "bit"; b.style.background = pick(cols);
    b.style.left = x + "px"; b.style.top = y + "px";
    document.body.appendChild(b);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 130;
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d - 60;
    try {
      b.animate([
        { transform:"translate(0,0) rotate(0deg)", opacity:1 },
        { transform:`translate(${dx}px,${dy + 160}px) rotate(${rnd(-300, 300)}deg)`, opacity:0 }
      ], { duration:900 + Math.random() * 400, easing:"cubic-bezier(.2,.7,.4,1)" }).onfinish = () => b.remove();
    } catch (e) { setTimeout(() => b.remove(), 50); }
  }
}
function burstAt(elm, n) { const r = elm.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n); }

function toast(text) {
  const old = document.getElementById("toast"); if (old) old.remove();
  const t = document.createElement("div");
  t.id = "toast"; t.className = "toast"; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("out"), 2200);
  setTimeout(() => t.remove(), 2700);
}

const PRAISE = ["Awesome!", "Brilliant!", "Nailed it!", "Genius!", "Perfect!", "Super builder!", "Great thinking!", "You got it!"];
const OOPS = ["Not quite — try again!", "Almost! Check it again.", "Hmm, try a different number.", "Close — have another go!"];
const starStr = n => [1, 2, 3].map(i => `<span class="${i <= n ? "" : "no"}">⭐</span>`).join("");

/* =====================================================================
   MathGame(cfg) — level map, 8-puzzle rounds, number pad, stars.
   cfg: { id, title, icon, iconSvg, color, tagline, howTo, levels:[{name, blurb, say, demo}],
          make(level, i, boost) -> puzzle, endlessName, resultExtra(level) }
   puzzle: { html, prompt, say, answers:[..] | choices:[{label, ok}], order, key,
             hint(k, stage, S), wrong(k, v, stage, S), onType(k, buf, stage), onFill(k, stage, S),
             onSolved(stage, S), reveal, mount(stage), autoSay }
   ===================================================================== */
function MathGame(cfg) {
  const TOTAL = 8, EXPRESS = 5, ENDLESS = 11, HEARTS = 3;
  const app = document.getElementById("app");
  let S = null;

  document.title = cfg.title + " · Math Lab";
  app.innerHTML = `
    <header class="top">
      <a class="home" href="index.html" id="homeBtn">⬅ <span>Games</span></a>
      <div class="gtitle"><span class="gi">${cfg.icon} </span>${cfg.title}</div>
      <div class="pill" id="starsum">⭐ 0</div>
      <button class="iconbtn" id="sndBtn" aria-label="Sound effects">🔔</button>
      <button class="vbtn" id="voiceBtn" aria-label="Narration">🗣️ <span>On</span></button>
    </header>
    <main class="screen" id="screen"></main>`;
  const screen = $("#screen");
  const sndBtn = $("#sndBtn"), voiceBtn = $("#voiceBtn");
  function syncToggles() {
    sndBtn.classList.toggle("off", !Store.get("sound"));
    sndBtn.textContent = Store.get("sound") ? "🔔" : "🔕";
    voiceBtn.classList.toggle("off", !Store.get("voice"));
    voiceBtn.innerHTML = `🗣️ <span>${Store.get("voice") ? "On" : "Off"}</span>`;
    $("#starsum").textContent = "⭐ " + Store.totalStars(cfg.id);
  }
  sndBtn.onclick = () => { Store.set("sound", !Store.get("sound")); syncToggles(); Sfx.tap(); toast(Store.get("sound") ? "Sound effects on" : "Sound effects off"); };
  voiceBtn.onclick = () => {
    Store.set("voice", !Store.get("voice"));
    if (!Store.get("voice")) Voice.stop();
    syncToggles();
    toast(Store.get("voice") ? "Narration on" : "Narration off — tap 🔊 Read it if you want to hear a question");
  };
  syncToggles();

  document.addEventListener("keydown", e => {
    if (!S || !S.P) return;
    if (S.solved && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); goNext(); return; }
    if (S.P.choices) { const n = parseInt(e.key, 10); const b = $$(".choice")[n - 1]; if (b) b.click(); return; }
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); press("del"); }
    else if (e.key === "Enter") check();
  });

  /* ---------- level map ---------- */
  function showMap() {
    S = null; Voice.stop(); closeOverlay(); syncToggles();
    screen.className = "screen";
    const g = Store.game(cfg.id);
    let nextMarked = false, html = `
      <div class="maphead" style="--gc:${cfg.color}">
        <div class="bigicon">${cfg.iconSvg || cfg.icon}</div>
        <div class="grow"><h1>${cfg.title}</h1><p>${cfg.tagline}</p></div>
        <button class="iconbtn" id="sayHow" aria-label="Read how to play">🔊</button>
      </div><div class="levels">`;
    cfg.levels.forEach((L, idx) => {
      const n = idx + 1, open = Store.levelOpen(cfg.id, n), st = g.stars[n] || 0;
      const isNext = open && !st && !nextMarked; if (isNext) nextMarked = true;
      html += `<button class="lvl ${open ? "" : "locked"} ${isNext ? "next" : ""}" data-l="${n}" style="--lc:${L.color || cfg.color}">
        <span class="ln">${n}</span><span class="lname">${L.name}</span>
        <span class="lstars">${open ? starStr(st) : ""}</span></button>`;
    });
    const eo = Store.levelOpen(cfg.id, ENDLESS);
    html += `<button class="lvl endless ${eo ? "" : "locked"}" data-l="${ENDLESS}">
        <span class="ln">∞</span><span class="lname">${cfg.endlessName || "Endless Challenge"} — ${eo ? "how far can you go? Best: " + (g.best || 0) : "finish Level 10 to open"}</span></button>`;
    html += `</div><div class="howto">${cfg.howTo}</div>`;
    screen.innerHTML = html;
    $$(".lvl", screen).forEach(b => b.onclick = () => {
      if (b.classList.contains("locked")) { Sfx.bad(); b.animate([{ transform:"translateX(-5px)" }, { transform:"translateX(5px)" }, { transform:"none" }], 250); return; }
      Sfx.tap(); showIntro(+b.dataset.l);
    });
    $("#sayHow").onclick = () => Voice.say(cfg.howToSay || cfg.howTo, true);
    window.scrollTo(0, 0);
  }

  /* ---------- overlays ---------- */
  function overlay(html, color) {
    closeOverlay();
    const o = document.createElement("div");
    o.className = "overlay"; o.id = "ov";
    o.innerHTML = `<div class="ocard" style="--gc:${color || cfg.color}">${html}</div>`;
    document.body.appendChild(o);
    return o;
  }
  function closeOverlay() { const o = $("#ov"); if (o) o.remove(); }

  function showIntro(level) {
    const L = level === ENDLESS
      ? { name:cfg.endlessName || "Endless Challenge", blurb:"Puzzles keep coming and keep getting harder. You have 3 hearts — a wrong answer costs one. How far can you go?", say:"Endless challenge! Puzzles keep getting harder. You have three hearts. How far can you go?" }
      : cfg.levels[level - 1];
    const o = overlay(`
      <div class="kicker">${level === ENDLESS ? "Challenge mode" : "Level " + level + " of " + cfg.levels.length}</div>
      <h2>${L.name}</h2>
      <p>${L.blurb}</p>
      ${L.demo ? `<div class="demo">${L.demo}</div>` : ""}
      <div class="obtns"><button class="btn alt" id="ovBack">⬅ Levels</button><button class="btn" id="ovGo">Go! ▶</button></div>`,
      L.color);
    Voice.say(L.say || L.blurb);
    $("#ovBack", o).onclick = () => { Sfx.tap(); showMap(); };
    $("#ovGo", o).onclick = () => { Sfx.tap(); Voice.stop(); closeOverlay(); startRound(level); };
  }

  /* ---------- a round ---------- */
  function startRound(level) {
    const endless = level === ENDLESS;
    S = { level, endless, i:0, results:[], hearts:HEARTS, score:0, seen:new Set() };
    const name = endless ? (cfg.endlessName || "Endless") : cfg.levels[level - 1].name;
    screen.className = "screen playing";
    screen.innerHTML = `
      <div class="play">
        <div class="phead">
          <div class="ptitle">${endless ? "∞" : "Level " + level} · ${name}</div>
          <div id="prog"></div>
        </div>
        <div class="stagewrap">
          <div class="stage" id="stage"></div>
          <div class="prompt" id="prompt"></div>
          <div class="msg" id="msg"></div>
          <div class="reveal" id="reveal"></div>
        </div>
        <div class="side">
          <div class="tools" id="tools">
            <button class="tool" id="sayQ">🔊 Read it</button>
            <button class="tool" id="hintB">💡 Hint</button>
          </div>
          <div id="input"></div>
        </div>
      </div>`;
    $("#sayQ").onclick = () => S && S.P && Voice.say(S.P.say || $("#prompt").textContent, true);
    $("#hintB").onclick = () => { if (!S || S.solved) return; S.usedHint = true; showHint(S.cur); };
    drawProgress();
    nextPuzzle();
    window.scrollTo(0, 0);
  }

  function drawProgress() {
    const p = $("#prog"); if (!p) return;
    if (S.endless) {
      p.innerHTML = `<span class="hearts">${"❤️".repeat(S.hearts)}${"🤍".repeat(HEARTS - S.hearts)}</span> <span class="score">Score ${S.score}</span>`;
      p.style.display = "flex"; p.style.gap = "10px"; p.style.alignItems = "center";
      return;
    }
    let h = '<div class="studs">';
    for (let i = 0; i < TOTAL; i++) {
      const r = S.results[i];
      h += `<span class="stud ${r || (i === S.i ? "now" : "")}"></span>`;
    }
    p.innerHTML = h + "</div>";
  }

  function makePuzzle() {
    let P = null;
    for (let t = 0; t < 25; t++) {
      if (S.endless) {
        const d = Math.min(10, 4 + Math.floor(S.score / 3));
        const lvl = Math.max(3, d - rnd(0, 2));
        P = cfg.make(lvl, rnd(3, 7), Math.max(0, Math.floor((S.score - 18) / 5)));
      } else {
        P = cfg.make(S.level, S.i, 0);
      }
      if (!P.key || !S.seen.has(P.key)) break;
    }
    if (P.key) S.seen.add(P.key);
    return P;
  }

  function nextPuzzle() {
    const P = makePuzzle();
    Object.assign(S, { P, tries:{}, buf:{}, stale:{}, done:new Set(), mistakes:0, gaveUp:false, usedHint:false, cur:null, solved:false, locked:false });
    const stage = $("#stage");
    stage.className = "stage"; void stage.offsetWidth; stage.className = "stage enter";
    stage.innerHTML = P.html;
    $("#prompt").innerHTML = P.prompt || "";
    setMsg("");
    $("#reveal").innerHTML = "";
    $("#tools").style.visibility = "visible";
    S.blanks = [];
    $$("[data-blank]", stage).forEach(b => {
      const k = +b.dataset.blank;
      S.blanks[k] = b; b.classList.add("blank"); b.textContent = "";
      b.onclick = () => { if (!S.solved && !S.done.has(k)) { Sfx.tap(); select(k); } };
    });
    if (P.choices) drawChoices(); else { drawPad(); select(firstOpen()); }
    if (P.mount) P.mount(stage, S);
    drawProgress();
    if (S.i > 0) window.scrollTo(0, 0);
    if (P.autoSay) Voice.say(P.say);
  }

  // run fn later, but only if we're still on the same puzzle
  function later(fn, ms) { const tok = S && S.P; setTimeout(() => { if (S && tok && S.P === tok) fn(); }, ms); }

  function setMsg(html, cls) { const m = $("#msg"); m.className = "msg " + (cls || ""); m.innerHTML = html; }

  function firstOpen() {
    const order = S.P.order || S.P.answers.map((_, k) => k);
    for (const k of order) if (!S.done.has(k)) return k;
    return null;
  }
  function select(k) {
    if (k == null) return;
    S.blanks.forEach(b => b && b.classList.remove("sel"));
    S.cur = k; S.blanks[k].classList.add("sel");
    $$(".hl", $("#stage")).forEach(e => e.classList.remove("hl"));
  }

  function drawPad() {
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "del", "0", "go"];
    const cols = ["var(--red)", "var(--blue)", "var(--azure)", "var(--orange)", "var(--purple)", "var(--red)", "var(--blue)", "var(--azure)", "var(--orange)"];
    $("#input").innerHTML = '<div class="pad">' + keys.map((k, i) =>
      k === "del" ? '<button class="key del" data-k="del" aria-label="Delete">⌫</button>'
      : k === "go" ? '<button class="key go" data-k="go" aria-label="Check">✓</button>'
      : `<button class="key" data-k="${k}" style="--c:${k === "0" ? "var(--purple)" : cols[i]}">${k}</button>`).join("") + "</div>";
    $$(".key").forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === "go") check(); else { Sfx.tap(); press(k); } });
  }

  function press(d) {
    if (!S || S.solved || S.locked || S.cur == null) return;
    const k = S.cur, P = S.P;
    let b = S.stale[k] ? "" : (S.buf[k] || "");
    S.stale[k] = false;
    const max = P.maxLen || Math.min(12, Math.max(3, String(P.answers[k]).length + 2));
    if (d === "del") b = b.slice(0, -1);
    else if (b.length < max) b = (b === "0" ? "" : b) + d;
    S.buf[k] = b;
    const el = S.blanks[k];
    el.classList.remove("bad");
    el.textContent = b ? group(b) : "";
    if (P.onType) P.onType(k, b, $("#stage"), S);
  }

  function check() {
    if (!S || S.solved || S.locked || S.cur == null) return;
    const k = S.cur, b = S.stale[k] ? "" : S.buf[k];
    if (!b) { const e = S.blanks[k]; e.classList.remove("bad"); void e.offsetWidth; e.classList.add("bad"); setTimeout(() => e.classList.remove("bad"), 400); return; }
    const v = Number(b);
    if (v === S.P.answers[k]) correct(k); else wrong(k, v);
  }

  function correct(k) {
    const el = S.blanks[k];
    S.done.add(k);
    el.classList.remove("sel", "bad"); el.classList.add("ok");
    Sfx.snap();
    $$(".hl", $("#stage")).forEach(e => e.classList.remove("hl"));
    if (S.P.onFill) S.P.onFill(k, $("#stage"), S);
    const nk = firstOpen();
    if (nk == null) solved();
    else { setMsg(S.P.answers.length > 1 ? "✔ Good!" : "", "good"); select(nk); }
  }

  function loseHeart() {
    S.hearts--; drawProgress();
    if (S.hearts <= 0) { S.solved = true; later(gameOver, 900); return true; }
    return false;
  }

  function wrong(k, v) {
    const el = S.blanks[k];
    S.tries[k] = (S.tries[k] || 0) + 1; S.stale[k] = true;
    const free = S.P.freeTries && k === 0 && S.tries[k] <= S.P.freeTries;   // guess-and-check puzzles
    if (!free) S.mistakes++;
    el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad");
    Sfx.bad();
    if (S.endless && !free && loseHeart()) { setMsg("Out of hearts!", "bad"); return; }
    let m = (S.P.wrong && S.P.wrong(k, v, $("#stage"), S)) || pick(OOPS);
    if (!S.endless && S.tries[k] >= (S.P.maxTries || 3)) {
      S.buf[k] = String(S.P.answers[k]); S.stale[k] = false;
      el.textContent = group(S.P.answers[k]);
      el.classList.remove("bad", "sel"); el.classList.add("given");
      S.done.add(k); S.gaveUp = true;
      setMsg(`The answer is <b>${group(S.P.answers[k])}</b>. Let's keep building!`, "bad");
      if (S.P.onFill) S.P.onFill(k, $("#stage"), S);
      const nk = firstOpen();
      if (nk == null) { S.locked = true; later(solved, 900); } else select(nk);
      return;
    }
    setMsg(m, "bad");
    if (S.tries[k] >= (S.P.hintAfter || 2)) showHint(k, true);
  }

  function showHint(k, append) {
    const P = S.P;
    const h = P.hint ? P.hint(k, $("#stage"), S) : null;
    if (!h) return;
    const m = $("#msg");
    if (!append) { m.className = "msg"; m.innerHTML = ""; }
    const old = $(".hint", m); if (old) old.remove();
    m.insertAdjacentHTML("beforeend", `<span class="hint">💡 ${h}</span>`);
  }

  function drawChoices() {
    const P = S.P;
    $("#input").innerHTML = '<div class="choices">' + P.choices.map((c, i) => `<button class="choice" data-i="${i}">${c.label}</button>`).join("") + "</div>";
    $$(".choice").forEach(b => b.onclick = () => {
      if (S.solved || S.locked || b.disabled) return;
      const c = P.choices[+b.dataset.i];
      if (c.ok) { b.classList.add("ok"); solved(); return; }
      b.classList.add("no"); b.disabled = true; S.mistakes++;
      S.tries[0] = (S.tries[0] || 0) + 1;
      Sfx.bad();
      if (S.endless && loseHeart()) { setMsg("Out of hearts!", "bad"); return; }
      setMsg((P.wrong && P.wrong(0, c.label, $("#stage"), S)) || "Not that one — try again!", "bad");
      if (S.tries[0] >= 1) showHint(0, true);
      const left = $$(".choice").filter(x => !x.disabled && !P.choices[+x.dataset.i].ok);
      if (!left.length) { S.gaveUp = true; S.locked = true; const okb = $$(".choice").find(x => P.choices[+x.dataset.i].ok); okb.classList.add("ok"); later(solved, 700); }
    });
  }

  function solved() {
    if (S.solved) return;
    S.solved = true;
    const res = S.gaveUp ? "miss" : (S.mistakes || S.usedHint) ? "silver" : "gold";
    if (S.endless) S.score++; else S.results[S.i] = res;
    drawProgress();
    const stage = $("#stage");
    stage.classList.remove("enter"); void stage.offsetWidth; stage.classList.add("win");
    Sfx.good(); burstAt(stage, res === "gold" ? 22 : 12);
    const praise = res === "gold" ? pick(PRAISE) : res === "silver" ? "You got it! 👍" : "Now you know it! 💪";
    setMsg(praise, "good");
    if (S.P.onSolved) S.P.onSolved(stage, S);
    if (S.P.reveal) $("#reveal").innerHTML = S.P.reveal;
    $("#tools").style.visibility = "hidden";
    const last = !S.endless && (S.i + 1 >= TOTAL);
    $("#input").innerHTML = `<button class="nextbtn" id="nextBtn">${last ? "Finish 🏁" : "Next ▶"}</button>`;
    $("#nextBtn").onclick = () => { Sfx.tap(); goNext(); };
  }

  function goNext() {
    if (!S || !S.solved || S.hearts <= 0) return;
    Voice.stop();
    if (S.endless) { S.i++; nextPuzzle(); return; }
    S.i++;
    if (S.i === EXPRESS && S.results.slice(0, EXPRESS).every(r => r === "gold")) return finish(true);
    if (S.i >= TOTAL) return finish(false);
    nextPuzzle();
  }

  function finish(express) {
    const level = S.level;
    const gold = S.results.filter(r => r === "gold").length;
    const stars = express ? 3 : gold >= 7 ? 3 : gold === 6 ? 2 : gold === 5 ? 1 : 0;
    const wasOpen = level < 10 ? Store.levelOpen(cfg.id, level + 1) : Store.levelOpen(cfg.id, ENDLESS);
    const gamesBefore = CATALOG.map(g => Store.gameOpen(g));
    Store.setStars(cfg.id, level, stars);
    const gamesAfter = CATALOG.map(g => Store.gameOpen(g));
    syncToggles();
    let badges = "";
    if (express) badges += `<span class="badge">⚡ EXPRESS PASS — 5 perfect in a row!</span>`;
    if (stars > 0 && !wasOpen) badges += `<span class="badge new">🔓 ${level < 10 ? "Level " + (level + 1) + " unlocked!" : "Endless Challenge unlocked!"}</span>`;
    CATALOG.forEach((g, i) => { if (!gamesBefore[i] && gamesAfter[i] && !g.soon) badges += `<span class="badge new">🎉 NEW GAME: ${g.title}! Find it on the games page.</span>`; });
    const studs = S.results.map(r => `<span class="stud ${r}"></span>`).join("") + (express ? `<span class="stud bolt"></span>`.repeat(TOTAL - S.results.length) : "");
    const title = stars === 3 ? "Master Builder!" : stars > 0 ? "Level Complete!" : "Keep Practicing!";
    const text = stars > 0
      ? `You solved <b>${gold}</b> of ${S.results.length} perfectly.`
      : `You need 5 perfect puzzles to clear this level. You got <b>${gold}</b>. Try again — you're getting stronger!`;
    const o = overlay(`
      <div class="kicker">Level ${level} · ${cfg.levels[level - 1].name}</div>
      <h2>${title}</h2>
      <div class="bigstars">${[1, 2, 3].map(i => `<span class="${i <= stars ? "" : "no"}" style="animation-delay:${i * 0.18}s">⭐</span>`).join("")}</div>
      <div class="resstuds">${studs}</div>
      <p>${text}</p>
      <div>${badges}</div>
      ${cfg.resultExtra ? cfg.resultExtra(level, stars) : ""}
      <div class="obtns">
        <button class="btn alt" id="rMap">▦ Levels</button>
        <button class="btn blue" id="rAgain">↻ Again</button>
        ${stars > 0 && level < 10 ? `<button class="btn" id="rNext">Level ${level + 1} ▶</button>` : ""}
        ${stars > 0 && level === 10 ? `<button class="btn" id="rEnd">∞ Endless ▶</button>` : ""}
      </div>`);
    if (stars > 0) { Sfx.win(); setTimeout(() => burst(innerWidth / 2, innerHeight / 3, 40), 250); } else Sfx.meh();
    Voice.say(stars > 0 ? `${title} ${stars} star${stars > 1 ? "s" : ""}!` : "Keep practicing! You can do it.");
    $("#rMap", o).onclick = () => { Sfx.tap(); showMap(); };
    $("#rAgain", o).onclick = () => { Sfx.tap(); closeOverlay(); startRound(level); };
    const rn = $("#rNext", o); if (rn) rn.onclick = () => { Sfx.tap(); showIntro(level + 1); };
    const re = $("#rEnd", o); if (re) re.onclick = () => { Sfx.tap(); showIntro(ENDLESS); };
    S.P = null;
  }

  function gameOver() {
    const rec = Store.setBest(cfg.id, S.score);
    const o = overlay(`
      <div class="kicker">${cfg.endlessName || "Endless Challenge"}</div>
      <h2>${rec ? "New Record! 🏆" : "Great Run!"}</h2>
      <div class="bigstars" style="font-size:44px">${S.score}</div>
      <p>puzzles solved · best: <b>${Store.game(cfg.id).best}</b></p>
      <div class="obtns"><button class="btn alt" id="gMap">▦ Levels</button><button class="btn" id="gAgain">↻ Play again</button></div>`);
    if (rec) { Sfx.win(); burst(innerWidth / 2, innerHeight / 3, 40); } else Sfx.meh();
    Voice.say(rec ? `New record! ${S.score} puzzles!` : `Great run! ${S.score} puzzles.`);
    $("#gMap", o).onclick = () => { Sfx.tap(); showMap(); };
    $("#gAgain", o).onclick = () => { Sfx.tap(); closeOverlay(); startRound(ENDLESS); };
    S.P = null;
  }

  // test hooks (used by automated checks; harmless in play)
  window.__game = { get S() { return S; }, showMap, startRound, check, press, goNext };
  showMap();
}

</script>
<script>
// ====== How each game looks on this page (the unlock order lives in CATALOG) ======
const LOOK = {
  pyramids:{ color:"#1f6fd1",
    desc:"Every brick is the two bricks under it added together. Can you finish the pyramid?",
    svg:`<svg viewBox="0 0 64 64" width="52" height="52"><g stroke="rgba(0,0,0,.18)" stroke-width="1.5"><rect x="22" y="8" width="20" height="13" rx="3" fill="#ffc919"/><rect x="11" y="25" width="20" height="13" rx="3" fill="#1f9d45"/><rect x="33" y="25" width="20" height="13" rx="3" fill="#1f9d45"/><rect x="1" y="42" width="20" height="13" rx="3" fill="#1f6fd1"/><rect x="22" y="42" width="20" height="13" rx="3" fill="#1f6fd1"/><rect x="43" y="42" width="20" height="13" rx="3" fill="#1f6fd1"/></g><g font-family="system-ui" font-weight="900" font-size="9" text-anchor="middle" fill="#fff"><text x="32" y="18" fill="#23314f">12</text><text x="21" y="35">5</text><text x="43" y="35">7</text><text x="11" y="52">2</text><text x="32" y="52">3</text><text x="53" y="52">4</text></g></svg>` },
  patterns:{ color:"#8a4fd8",
    desc:"The machine follows a secret rule. Crack the code and find the missing numbers!",
    svg:`<svg viewBox="-50 -50 100 100" width="52" height="52"><path d="${gear(10, 46, 36)}" fill="#8a4fd8"/><circle r="26" fill="#fff"/><text y="8" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="22" fill="#23314f">+3</text></svg>` },
  googol:{ color:"#28195e",
    desc:"Zeros, powers of ten, a googol and a googolplex. Zoom your rocket past the galaxy!",
    svg:`<svg viewBox="0 0 64 64" width="52" height="52"><rect x="1" y="1" width="62" height="62" rx="14" fill="#141a3d"/><circle cx="12" cy="14" r="1.6" fill="#fff"/><circle cx="50" cy="10" r="1.3" fill="#fff"/><circle cx="54" cy="44" r="1.5" fill="#fff"/><circle cx="8" cy="46" r="1.2" fill="#fff"/><text x="31" y="41" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="21" fill="#ffe16b">10</text><text x="46" y="29" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="12" fill="#7fe3ff">100</text></svg>` },
  gears:{ color:"#ff8a1f",
    desc:"Real Technic gear trains: if the little gear turns 3 times, how many times does the big one turn?",
    svg:`<svg viewBox="0 0 64 64" width="52" height="52"><g transform="translate(22 34)"><path d="${gear(12, 20, 16)}" fill="#8d96a8"/><circle r="5" fill="#fff"/></g><g transform="translate(46 20)"><path d="${gear(8, 14, 10.5)}" fill="#ff8a1f"/><circle r="4" fill="#fff"/></g></svg>` },
};
// Roadmap shown in the grown-ups panel
const ROADMAP = [
  ["Brick Pyramids", "adding & subtracting, reasoning backwards, early algebra (built)"],
  ["Pattern Machine", "sequences, rules, doubling, squares, Fibonacci, primes (built)"],
  ["Googol Zoom", "place value, powers of ten, exponents, googol & googolplex (built)"],
  ["Gear Lab", "Technic gear ratios: multiplication, division, compound trains"],
  ["Stud Arrays", "multiplication as Lego plates, splitting 12×4 into 10×4 + 2×4"],
  ["Target Builder", "reach a target with + − × (Countdown / 24-style)"],
  ["Balance Scale", "missing numbers: □ + 17 = 50, 3 × □ + 2 = 20"],
  ["Prime Factory", "primes, factor trees, the sieve"],
  ["Binary Lights", "counting in base 2 with lights on and off"],
  ["Logic Grids", "4×4 then 6×6 sum/product puzzles (KenKen-style)"],
  ["Below Zero", "negative numbers on a number line"],
  ["Fraction Bricks", "halves, quarters and eighths with 1×8 bricks"],
];

function gear(teeth, ro, ri) {
  let d = ""; const N = teeth * 4;
  for (let k = 0; k < N; k++) { const a = k / N * Math.PI * 2, r = (k % 4 < 2) ? ro : ri; d += (k ? "L" : "M") + (Math.cos(a) * r).toFixed(1) + " " + (Math.sin(a) * r).toFixed(1); }
  return d + "Z";
}

// ---- math pictures (drawn in code, no image files) ----
function fibSVG() {
  const sizes = [1, 1, 2, 3, 5, 8, 13], fills = ["#ffe08a", "#ffd0a8", "#bfe3ff", "#c8f0cf", "#e2d4ff", "#ffc9d9", "#fff1b8"];
  let x0 = 0, y0 = 0, x1 = 1, y1 = 1, sq = [], arcs = [];
  const rot = (x, y) => [y, -x];                     // turn the picture sideways so it's wide
  sizes.forEach((s, k) => {
    const d = k === 0 ? 3 : (k - 1) % 4;               // 0 right, 1 down, 2 left, 3 up
    let x, y;
    if (k === 0) { x = 0; y = 0; }
    else if (d === 0) { x = x1; y = y0; x1 += s; }
    else if (d === 1) { x = x0; y = y1; y1 += s; }
    else if (d === 2) { x = x0 - s; y = y0; x0 -= s; }
    else { x = x0; y = y0 - s; y0 -= s; }
    const P = { 0:[[x, y], [x + s, y + s]], 1:[[x + s, y], [x, y + s]], 2:[[x + s, y + s], [x, y]], 3:[[x, y + s], [x + s, y]] }[d];
    const a = rot(...P[0]), b = rot(...P[1]);
    sq.push(`<rect x="${y}" y="${-x - s}" width="${s}" height="${s}" fill="${fills[k]}" stroke="#23314f" stroke-width=".12"/>` +
      (s >= 2 ? `<text x="${y + s / 2}" y="${-x - s / 2 + s * .12}" font-size="${s * .34}" text-anchor="middle" font-family="system-ui" font-weight="900" fill="#23314f" opacity=".55">${s}</text>` : ""));
    arcs.push((k ? "" : `M${a[0]} ${a[1]}`) + `A${s} ${s} 0 0 1 ${b[0]} ${b[1]}`);
  });
  // bounding box after rotation: x' in [y0, y1], y' in [-x1, -x0]
  return `<svg viewBox="${y0 - .5} ${-x1 - .5} ${y1 - y0 + 1} ${x1 - x0 + 1}">${sq.join("")}<path d="${arcs.join("")}" fill="none" stroke="#d9281c" stroke-width=".38" stroke-linecap="round"/></svg>`;
}
function sunflowerSVG() {
  let h = `<svg viewBox="-56 -42 112 84"><rect x="-56" y="-42" width="112" height="84" fill="#fff8e1"/>`;
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let n = 1; n <= 260; n++) {
    const r = 2.1 * Math.sqrt(n), t = n * golden;
    const col = n % 2 ? "#8a5a1c" : "#b7791f";
    h += `<circle cx="${(r * Math.cos(t)).toFixed(2)}" cy="${(r * Math.sin(t)).toFixed(2)}" r="${(0.9 + n / 260).toFixed(2)}" fill="${col}"/>`;
  }
  for (let p = 0; p < 21; p++) {
    const t = p / 21 * 2 * Math.PI, R = 36.5;
    h += `<ellipse cx="${(R * Math.cos(t)).toFixed(1)}" cy="${(R * Math.sin(t)).toFixed(1)}" rx="5.5" ry="2.6" fill="#ffc919" transform="rotate(${(t * 180 / Math.PI).toFixed(1)} ${(R * Math.cos(t)).toFixed(1)} ${(R * Math.sin(t)).toFixed(1)})" opacity=".9"/>`;
  }
  return h + "</svg>";
}
function pascalSVG(rows) {
  rows = rows || 16;
  let h = `<svg viewBox="-1 -1 ${rows * 2 + 1} ${rows * 1.5 + 1}">`, row = [1];
  for (let r = 0; r < rows; r++) {
    row.forEach((v, c) => {
      const x = rows - r + c * 2 - .5, y = r * 1.5;
      h += `<circle cx="${x}" cy="${y + .5}" r=".82" fill="${v % 2 ? "#1f6fd1" : "#dfe6f3"}"/>`;
      if (r < 5) h += `<text x="${x}" y="${y + .82}" font-size=".95" text-anchor="middle" font-family="system-ui" font-weight="900" fill="#fff">${v}</text>`;
    });
    const next = [1];
    for (let c = 1; c < row.length; c++) next.push(row[c - 1] + row[c]);
    next.push(1); row = next;
  }
  return h + "</svg>";
}
function sierpinskiSVG() {
  const tris = [];
  (function go(ax, ay, bx, by, cx, cy, d) {
    if (d === 0) { tris.push(`${ax.toFixed(2)},${ay.toFixed(2)} ${bx.toFixed(2)},${by.toFixed(2)} ${cx.toFixed(2)},${cy.toFixed(2)}`); return; }
    const abx = (ax + bx) / 2, aby = (ay + by) / 2, bcx = (bx + cx) / 2, bcy = (by + cy) / 2, cax = (cx + ax) / 2, cay = (cy + ay) / 2;
    go(ax, ay, abx, aby, cax, cay, d - 1); go(abx, aby, bx, by, bcx, bcy, d - 1); go(cax, cay, bcx, bcy, cx, cy, d - 1);
  })(50, 2, 4, 72, 96, 72, 5);
  const cols = ["#d9281c", "#ff8a1f", "#8a4fd8"];
  return `<svg viewBox="0 0 100 75"><polygon points="50,2 4,72 96,72" fill="#f4f6fb"/>` +
    tris.map((p, i) => `<polygon points="${p}" fill="${cols[Math.floor(i / 81)]}"/>`).join("") + `</svg>`;
}
const PICS = [
  { title:"Fibonacci spiral", sub:"1, 1, 2, 3, 5, 8…", svg:fibSVG,
    text:"Each number is the two before it added together: 1, 1, 2, 3, 5, 8, 13… Squares with those sizes fit together perfectly, and a spiral grows right through them.",
    q:"What comes after 13?", a:"21 (because 8 + 13 = 21)" },
  { title:"Sunflower", sub:"nature counts too", svg:sunflowerSVG,
    text:"Sunflower seeds grow in spirals. Count the spirals turning one way, then the other way, and you usually get two Fibonacci numbers that sit next to each other, like 34 and 55.",
    q:"Which Fibonacci number comes after 55?", a:"89 (because 34 + 55 = 89)" },
  { title:"Pascal's triangle", sub:"a secret pattern", svg:pascalSVG,
    text:"Each number is the two numbers above it added together — a Brick Pyramid upside down! Paint the odd numbers blue and a picture made of triangles appears.",
    q:"The row after 1, 4, 6, 4, 1 is…?", a:"1, 5, 10, 10, 5, 1" },
  { title:"Sierpiński triangle", sub:"triangles forever", svg:sierpinskiSVG,
    text:"Take a triangle and cut out the middle. Now do the same to each of the 3 triangles that are left, and again, and again… forever. It's the same shape the odd numbers make in Pascal's triangle!",
    q:"1 triangle becomes 3, then 9. How many after 5 steps?", a:"243 (3 × 3 × 3 × 3 × 3)" },
];
(function () {
  const box = document.getElementById("tiles");
  PICS.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "tile";
    b.innerHTML = p.svg() + `<span>${p.title}</span><small>${p.sub}</small>`;
    b.onclick = () => {
      Sfx.tap();
      const o = overlay(`<div class="explore"><h2>${p.title}</h2>${p.svg()}<p>${p.text}</p>
        <div class="q">🤔 ${p.q}<div class="ans" id="ans">✅ ${p.a}</div></div>
        <div class="btns"><button class="btn alt" id="readX">🔊 Read</button><button class="btn" id="showAns">Show answer</button><button class="btn alt" id="closeX">Close</button></div></div>`);
      Voice.say(p.text + " " + p.q);
      o.querySelector("#readX").onclick = () => Voice.say(p.text + " " + p.q, true);
      o.querySelector("#showAns").onclick = () => { o.querySelector("#ans").classList.add("show"); Sfx.good(); };
      o.querySelector("#closeX").onclick = () => { Voice.stop(); o.remove(); };
    };
    box.appendChild(b);
  });
})();

// ---- narration switch ----
(function () {
  const b = document.getElementById("narr");
  const sync = () => { const on = !!Store.get("voice"); b.textContent = "🗣️ Narration: " + (on ? "On" : "Off"); b.classList.toggle("off", !on); };
  b.onclick = () => { Store.set("voice", !Store.get("voice")); if (!Store.get("voice")) Voice.stop(); sync(); toast(Store.get("voice") ? "Narration on" : "Narration off — nothing will be read aloud unless you tap 🔊"); };
  sync();
  window.syncNarr = sync;
})();

// ---- cards ----
function render() {
  const grid = document.getElementById("grid");
  const seen = Store.get("seen") || {};
  grid.innerHTML = "";
  document.getElementById("total").textContent = "⭐ " + Store.allStars();
  let teaserShown = false;
  for (const g of CATALOG) {
    const look = LOOK[g.id], open = Store.gameOpen(g);
    if (open && !g.soon) {
      const hi = Store.highest(g.id), st = Store.totalStars(g.id), best = Store.game(g.id).best || 0;
      const a = document.createElement("a");
      a.className = "card playable"; a.href = g.file;
      a.innerHTML =
        '<span class="accent" style="background:' + look.color + '"></span>' +
        (seen[g.id] ? "" : '<span class="ribbon">NEW!</span>') +
        '<div class="emoji">' + look.svg + '</div>' +
        '<h2>' + g.title + '</h2>' +
        '<p>' + look.desc + '</p>' +
        '<div class="prog"><div class="bar"><i style="width:' + (hi * 10) + '%;background:' + look.color + '"></i></div>' +
        (hi >= 10 ? "🏆 All 10 levels cleared" + (best ? " · endless best " + best : "") : hi ? "Level " + hi + " of 10 cleared" : "Start at Level 1") +
        ' · ⭐ ' + st + '/30</div>' +
        '<span class="play" style="background:' + look.color + '">PLAY ▶</span>';
      a.addEventListener("click", () => { const s = Store.get("seen") || {}; s[g.id] = true; Store.set("seen", s); });
      grid.appendChild(a);
    } else if (!teaserShown) {
      teaserShown = true;
      const d = document.createElement("div");
      d.className = "card soon";
      let line;
      if (open) line = "🛠️ You're ready for this one! It's still being built — coming soon.";
      else {
        const need = CATALOG.find(x => x.id === g.needs.game);
        const have = Math.min(g.needs.level, Store.highest(g.needs.game));
        line = "🔒 Clear Level " + g.needs.level + " of " + need.title + " to unlock (" + have + "/" + g.needs.level + ")";
      }
      d.innerHTML =
        '<span class="accent" style="background:#c3cee2"></span>' +
        '<div class="emoji">' + look.svg + '</div>' +
        '<h2>' + (open ? g.title : "Next: " + g.title) + '</h2>' +
        '<p>' + look.desc + '</p>' +
        '<span class="badge">' + line + '</span>';
      grid.appendChild(d);
    }
  }
}

// ---- "new game unlocked" celebration (once per game) ----
function celebrate() {
  const cel = Store.get("celebrated") || {};
  const fresh = CATALOG.filter(g => g.needs && !g.soon && Store.gameOpen(g) && !cel[g.id] && !Store.get("unlockAll"));
  if (!fresh.length) return;
  fresh.forEach(g => cel[g.id] = true);
  Store.set("celebrated", cel);
  const g = fresh[fresh.length - 1];
  const o = overlay(`<div class="celebrate"><div class="big">🎉</div><h2>New game unlocked!</h2>
    <div style="margin:10px auto">${LOOK[g.id].svg}</div><p style="font-size:20px"><b>${g.title}</b></p>
    <p>${LOOK[g.id].desc}</p>
    <div class="btns"><button class="btn" id="celOk">Awesome! ▶</button></div></div>`);
  setTimeout(() => burst(innerWidth / 2, innerHeight / 3, 50), 200);
  Sfx.win();
  Voice.say("New game unlocked! " + g.title + "!");
  o.querySelector("#celOk").onclick = () => o.remove();
}

function overlay(html) {
  const o = document.createElement("div");
  o.className = "overlay";
  o.innerHTML = '<div class="ocard">' + html + '</div>';
  o.addEventListener("click", e => { if (e.target === o) { Voice.stop(); o.remove(); } });
  document.body.appendChild(o);
  return o;
}

// ---- grown-ups panel: press and hold the gear ----
(function () {
  const gearEl = document.getElementById("gear");
  let t = null;
  const start = e => { e.preventDefault(); gearEl.classList.add("hold"); t = setTimeout(() => { gearEl.classList.remove("hold"); parentPanel(); }, 1200); };
  const stop = () => { gearEl.classList.remove("hold"); clearTimeout(t); };
  gearEl.addEventListener("pointerdown", start);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => gearEl.addEventListener(ev, stop));
  gearEl.addEventListener("contextmenu", e => e.preventDefault());
})();

function parentPanel() {
  const sw = (id, on, label) => `<div class="row"><span>${label}</span><button class="sw ${on ? "on" : ""}" id="${id}"></button></div>`;
  const rows = CATALOG.filter(g => !g.soon).map(g => `<tr><td>${g.title}</td><td>${Store.gameOpen(g) ? "open" : "locked"}</td><td>${Store.highest(g.id)}/10</td><td>${Store.totalStars(g.id)}/30</td><td>${Store.game(g.id).best || 0}</td></tr>`).join("");
  const o = overlay(`
    <h2>⚙︎ Grown-ups</h2>
    ${sw("swAll", Store.get("unlockAll"), "Open all games and levels")}
    ${sw("swSnd", Store.get("sound"), "Sound effects")}
    ${sw("swVoice", Store.get("voice"), "Narration (read things aloud automatically)")}
    <h3>Progress</h3>
    <table><tr><th>Game</th><th>Status</th><th>Levels</th><th>Stars</th><th>Endless</th></tr>${rows}</table>
    <h3>How it works</h3>
    <p>Each level is 8 puzzles. If the first 5 are all perfect, that’s an ⚡ Express Pass (3 stars, level cleared). Otherwise 5+ perfect puzzles out of 8 clears the level (5 = ⭐, 6 = ⭐⭐, 7–8 = ⭐⭐⭐). A puzzle counts as perfect only with no wrong tries and no hint. Three wrong tries reveal the answer. Clearing Level 5 of a game unlocks the next game; clearing Level 10 opens its Endless mode.</p>
    <h3>Roadmap</h3>
    <ol>${ROADMAP.map(r => `<li><b>${r[0]}</b> — ${r[1]}</li>`).join("")}</ol>
    <div class="btns"><button class="btn warn" id="reset">Reset all progress</button><button class="btn alt" id="close">Close</button></div>`);
  const flip = (id, key, after) => { const b = o.querySelector("#" + id); b.onclick = () => { Store.set(key, !Store.get(key)); b.classList.toggle("on", !!Store.get(key)); if (after) after(); }; };
  flip("swAll", "unlockAll", render);
  flip("swSnd", "sound");
  flip("swVoice", "voice", () => window.syncNarr && window.syncNarr());
  const rb = o.querySelector("#reset");
  rb.onclick = () => {
    if (rb.dataset.armed) { Store.reset(); Store.set("celebrated", {}); o.remove(); render(); return; }
    rb.dataset.armed = "1"; rb.textContent = "Tap again to erase everything";
    setTimeout(() => { delete rb.dataset.armed; rb.textContent = "Reset all progress"; }, 4000);
  };
  o.querySelector("#close").onclick = () => o.remove();
}

render();
celebrate();
window.addEventListener("pageshow", e => { if (e.persisted) { Store.load(); render(); celebrate(); } });
</script>
</body>
</html>
